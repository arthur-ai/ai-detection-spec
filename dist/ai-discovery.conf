{
  "queries": {
    "apps": {
      "description": "Every installed .app bundle",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'app' AS kind, bundle_identifier AS id, bundle_short_version AS ver, path AS loc, '' AS extra, '' AS perms FROM apps;"
    },
    "browser": {
      "description": "Browser extensions with their permissions, and native messaging bridges",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'ext' AS kind, identifier AS id, version AS ver, profile_path AS loc, browser_type AS extra, permissions || CASE WHEN manifest_json LIKE '%<all_urls>%' THEN ',<all_urls>' ELSE '' END AS perms FROM users CROSS JOIN chrome_extensions USING (uid) UNION ALL SELECT 'nmh', filename, '', path, '', '' FROM file WHERE path LIKE '/Users/%/Library/Application Support/%/NativeMessagingHosts/%.json' AND filename != 'com.apple.passwordmanager.json' UNION ALL SELECT 'nmh', filename, '', path, '', '' FROM file WHERE path LIKE '/Users/%/Library/Application Support/%/%/NativeMessagingHosts/%.json' AND filename != 'com.apple.passwordmanager.json' UNION ALL SELECT 'nmh', filename, '', path, '', '' FROM file WHERE path LIKE '/Library/%/%/NativeMessagingHosts/%.json' AND filename != 'com.apple.passwordmanager.json';"
    },
    "containers": {
      "description": "Container images on the host, which hide agents every other branch misses",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'image' AS kind, tags AS id, '' AS ver, id AS loc, CAST(size_bytes AS TEXT) AS extra, '' AS perms FROM docker_images;"
    },
    "filesystem": {
      "description": "Home-directory install locations: CLI shims, state dotdirs, tool venvs, model stores",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'file' AS kind, path AS id, '' AS ver, path AS loc, '' AS extra, '' AS perms FROM file WHERE path LIKE '/Users/%/.local/bin/%' UNION ALL SELECT 'file', path, '', path, '', '' FROM file WHERE path LIKE '/Users/%/.%/' UNION ALL SELECT 'file', path, '', path, '', '' FROM file WHERE path LIKE '/Users/%/.local/pipx/venvs/%/' OR path LIKE '/Users/%/.local/share/uv/tools/%/';"
    },
    "packages": {
      "description": "Every npm global and every Homebrew formula and cask",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'npm' AS kind, name AS id, version AS ver, path AS loc, '' AS extra, '' AS perms FROM npm_packages WHERE path NOT LIKE '%/node_modules/%/node_modules/%' UNION ALL SELECT 'brew', name, version, path, type, '' FROM homebrew_packages;"
    },
    "runtime": {
      "description": "Non-Apple launchd jobs, and every process holding a listening port",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'daemon' AS kind, label AS id, '' AS ver, path AS loc, '' AS extra, '' AS perms FROM launchd WHERE label NOT LIKE 'com.apple.%' UNION ALL SELECT 'port', CAST(lp.port AS TEXT), '', p.path, lp.address, '' FROM listening_ports lp JOIN processes p USING (pid) WHERE lp.port > 0;"
    }
  }
}
