# What these queries CANNOT see. The canonical list, and the only copy: docs/limits.md
# renders it and README points at that, so a reader meets these once.
#
# These are properties of the platform and the osquery tables. No amount of test coverage
# moves them, which is why they are stated rather than left to be discovered.
blind_spots:
  - spot: "Anything inside a VM, a Codespace or a cloud dev box"
    why: "The scanner sees the machine it runs on. Containers are the exception and only partly: `--deep` reads images, running containers and their vendor labels, so an agent IN a container is now visible from outside it"
  - spot: "What a process inside a container is doing"
    why: "`docker_containers` gives the container's own command and entrypoint, which is what it was started as. The processes actually running inside it are in `docker_container_processes`, which requires a constraint on the container id -- reachable through a join, verified -- and is not collected, because a cmdline can carry `--api-key` and redaction is not designed yet"
  - spot: "A container that is not running"
    why: "`docker_containers` lists RUNNING containers only. Measured 2026-09-11 on Docker 28.4.0: two exited containers produced zero rows. A stopped agent container is seen through its image and not as a container, so an empty container list is not an empty machine"
  - spot: "Containers outside Docker Desktop, and Podman anywhere"
    why: "Colima, Rancher Desktop and Podman keep their sockets elsewhere, and `docker_images` cannot read containerd or Podman image stores. Podman's socket is deliberately not probed: it would pass the health check and return zero images, which reads as \"we looked\". The runtime is NAMED instead: `bin/container-scan` looks for a socket or a binary on disk -- presence only, no daemon conversation -- and the marker row reads `unreadable:podman` rather than `absent`, which is the word a machine with no containers gets. What is still unknown is whether it holds any containers at all, and what they are"
  - spot: "Whether an image is really the vendor's, when the vendor sets no label"
    why: "An image name is chosen by whoever tags it, so `docker tag alpine paulgauthier/aider` produces the same finding. The `image_labels` route closes this for vendors who set `org.opencontainers.image.source`, which a retagger cannot forge -- but that is a fact about a project's release pipeline, not about being an agent. Measured 2026-09-11: the currently published ghcr.io/openhands/openhands and ghcr.io/block/goose carry it; paulgauthier/aider carries no labels at all and sweagent/swe-agent only its base image's, so for those two a finding is exactly as forgeable as the tag"
  - spot: "An untagged (dangling) image"
    why: "Untested -- no dangling image existed on the machine this was measured on. Unknown, not covered"
  - spot: "Snap and Flatpak packages"
    why: "osquery has no `snap_packages` or `flatpak_packages` table at any version, checked against the source at 5.10.0 and 5.23.1. A snap- or flatpak-installed agent is invisible on every package route"
  - spot: "Alpine Linux, and apk packages anywhere"
    why: "Two walls, and either alone would do. osquery has no `apk_packages` table at any version: absent from the published schemas for 4.5.0, 5.0.1 and 5.23.1, and `SELECT count(*) FROM apk_packages` answers `no such table` on Ubuntu 24.04 and Fedora 41 at 5.23.1. And osquery ships no musl build: its 5.23.1 Linux tarball, the only non-deb, non-rpm artifact, fails to load on alpine:3.22 even with gcompat and libstdc++ installed (`Error relocating osqueryd: __res_init: symbol not found`, then argz_*, canonicalize_file_name and nine more). Measured 2026-10-20. So an Alpine host cannot run the collector, and an agent installed from an apk repository -- Claude Code publishes one -- is invisible on every route, not only the package ones"
  - spot: "AppImage and tarball installs on Linux"
    why: "Neither leaves a package record, and Cursor's primary Linux download is an AppImage. Only `desktop_ids` can see one, and only if the install writes a `.desktop` entry"
  - spot: "An NSS-only account whose home directory is outside /home or /root"
    why: "Since osquery 5.13.1 the unconstrained Linux `users` table reads /etc/passwd directly, so an account that only an NSS module knows -- GCE OS Login, SSSD, LDAP, Active Directory -- is not in it. The browser and VS Code branches take their uids from the home directories on disk as well, which covers every such account that has logged in under /home or /root. One whose home was placed elsewhere, or one that has never logged in, is reached by neither list. Read off osquery's linux/users.cpp at 5.23.1"
  - spot: "Which agent installed a systemd unit"
    why: "No unit name is a signature. The macOS launchd prefixes were read off live installs; no Linux unit name has been, so the route carries no values and unit rows stay evidence"
  - spot: "A systemd unit the running manager has not loaded"
    why: "`systemd_units` lists loaded units, not unit files on disk -- unlike macOS's `launchd`. So a unit installed but never started is invisible, and so is anything under `systemctl --user`, which reads a different bus"
  - spot: "Windows, entirely"
    why: "No queries, no routes, no runner. It is a parallel PowerShell implementation rather than a port: `bin/` is bash and every scenario is a shell script"
  - spot: "Which filesystem roots an MCP server exposes"
    why: "Requires parsing arbitrary JSON config; osquery has no table for it"
  - spot: "Outbound destinations by hostname"
    why: "`process_open_sockets` returns an IP, not a name"
  - spot: "Which agent holds a listening port"
    why: "A port is only attributable when the process holding it already names the agent, so it never identifies anything on its own -- 8080-held-by-java would read as llama.cpp. Ports are collected as evidence and are never a signature"
  - spot: "A cloned-but-never-run source checkout"
    why: "Nothing has been created on disk yet"
  - spot: "What an agent *does*"
    why: "Every route reports presence and declared capability. `permissions` says an extension **may** read every page, never that it did"
  - spot: "The identity of a sideloaded extension"
    why: "osquery derives `identifier` from the manifest `key`, which unpacked and sideloaded extensions do not carry, so they report an empty one. A Web Store CRX does carry it. The row is not anonymous: it carries `unreferenced` when Chrome would not load it, or `sideloaded:` and the manifest's SHA-256 when it would, so a sideload is found by hash rather than by id"
  - spot: "GitHub Copilot inside VS Code"
    why: "Copilot Chat now ships BUILT IN: VS Code's own bundle carries `GitHub.copilot-chat` 0.64.1 among its 97 built-in extensions, and `vscode_extensions` reports only the user extension directories -- a run with 97 built-ins present returned 2 rows, both user-installed. The marketplace `github.copilot` cannot be installed over it either, because it pins `github.copilot-chat` 0.48.1 and VS Code refuses to downgrade a built-in, so no scenario can produce the identifier. Measured on VS Code stable, 2026-09-05. The route therefore cannot identify Copilot at all, which is why no signature is carried rather than one that would match every VS Code install -- `copilot-cli` is the Copilot this catalog can prove, through npm, Homebrew and the JetBrains plugin. Detecting the built-in would report the EDITOR, not a fleet's choice of agent"
  - spot: "VS Code extensions on osquery below 5.11.0"
    why: "`vscode_extensions` arrived in 5.11.0, above this repo's 5.10.0 floor, so `queries/vscode.sql` declares its own minimum and returns nothing on an older endpoint. The `vscode_edition` column that tells VS Code from Cursor and Windsurf came in 5.15.0"
  - spot: "JetBrains plugins on osquery below 5.18.0"
    why: "`jetbrains_plugins` arrived in 5.18.0, so `queries/jetbrains.sql` declares that floor and returns nothing on an older endpoint. The composed artifact is one statement, so on 5.11 to 5.17 it fails whole; `bin/discover --write` runs the branch on its own and reports it as `error`"
  - spot: "The identity of a JetBrains plugin"
    why: "The table exposes no plugin.xml id, only a display name, a vendor and the path, so the identifier is the plugin's directory name. A plugin whose directory was renamed on disk is not recognised, and a plugin shipped as a bare jar carries its version in the name"
  - spot: "Whether an agent was running a minute ago"
    why: "A `proc` row is a sample of the process table when the query ran, not a history. An agent started and stopped between two runs leaves nothing on this route"
  - spot: "A running node CLI that names no package path"
    why: "A global launched through its bin link reads `node /usr/local/bin/<name>`, and a process that renames itself carries no path at all. `queries/running.sql` finds OpenClaw's gateway through its workers, which run a script under node_modules/openclaw; a CLI that starts none is found as installed and not as running"
  - spot: "Behaviour that only appears after launch or sign-in"
    why: "Nothing here launches an app -- `open -a` needs an Aqua session and SSH has none -- so first-launch daemons, ports and state directories go unobserved, and account-gated products are never signed in to"
  - spot: "Whether ChatGPT's dots is enabled or in use"
    why: "A dot runs on an OpenAI cloud computer; local computer access is opt-in and runs through the ChatGPT desktop app, which `chatgpt-desktop` already reports (help.openai.com/en/articles/20001554-manage-dots-in-chatgpt-workspaces). No dots-only signal has been read off a real install, so a match means the app, never dots"
