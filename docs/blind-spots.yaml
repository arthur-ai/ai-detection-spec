# What the osquery binding CANNOT see: properties of the platform and of osquery's tables,
# which no amount of test coverage moves. The only copy; tools/agent_status.py renders it into
# docs/limits.md, and osquery/README.md points there. A gap belonging to one query is in that
# query's header instead.
blind_spots:
  - spot: "Anything inside a VM, a Codespace or a cloud dev box"
    why: "The scanner sees the machine it runs on. Containers are the exception and only partly: `--deep` reads images, running containers and their vendor labels, so an agent IN a container is now visible from outside it"
  - spot: "What a process inside a container is doing"
    why: "`docker_containers` gives the container's own command and entrypoint, which is what it was started as. The processes actually running inside it are in `docker_container_processes`, which requires a constraint on the container id -- reachable through a join, verified -- and is not collected, because a cmdline can carry `--api-key` and redaction is not designed yet"
  - spot: "A container that is not running"
    why: "`docker_containers` lists RUNNING containers only. Measured 2026-09-11 on Docker 28.4.0: two exited containers produced zero rows. A stopped agent container is seen through its image and not as a container, so an empty container list is not an empty machine"
  - spot: "Containers outside Docker Desktop, and Podman anywhere"
    why: "Colima, Rancher Desktop and Podman keep their sockets elsewhere, and `docker_images` cannot read containerd or Podman image stores. Podman's socket is deliberately not probed: it would pass the health check and return zero images, which reads as \"we looked\". The runtime is NAMED instead: `osquery/bin/container-scan` looks for a socket or a binary on disk -- presence only, no daemon conversation -- and the marker row reads `unreadable:podman` rather than `absent`, which is the word a machine with no containers gets. What is still unknown is whether it holds any containers at all, and what they are"
  - spot: "Whether an image is really the vendor's, when the vendor sets no label"
    why: "An image name is chosen by whoever tags it, so `docker tag alpine paulgauthier/aider` produces the same finding. The `image_labels` route closes this for vendors who set `org.opencontainers.image.source`, which a retagger cannot forge -- but that is a fact about a project's release pipeline, not about being an agent. Measured 2026-09-11: the currently published ghcr.io/openhands/openhands and ghcr.io/block/goose carry it; paulgauthier/aider carries no labels at all and sweagent/swe-agent only its base image's, so for those two a finding is exactly as forgeable as the tag"
  - spot: "An untagged (dangling) image"
    why: "Untested -- no dangling image existed on the machine this was measured on. Unknown, not covered"
  - spot: "Snap and Flatpak packages"
    why: "osquery has no `snap_packages` or `flatpak_packages` table at any version, checked against the source at 5.10.0 and 5.23.1. A snap- or flatpak-installed agent is invisible on every package route"
  - spot: "Alpine Linux, and apk packages anywhere"
    why: "Two walls. osquery has no `apk_packages` table at any version (absent from the schemas for 4.5.0, 5.0.1 and 5.23.1). And it ships no musl build: the 5.23.1 Linux tarball fails to load on alpine:3.22 even with gcompat and libstdc++ (`Error relocating osqueryd: __res_init: symbol not found`), measured 2026-10-20. So an Alpine host cannot run the binding at all, and an agent installed from an apk repository, as Claude Code publishes, is invisible on every route"
  - spot: "AppImage and tarball installs on Linux"
    why: "Neither leaves a package record, and Cursor's primary Linux download is an AppImage. Only `desktop_ids` can see one, and only if the install writes a `.desktop` entry"
  - spot: "A binary installed under /usr/local/bin"
    why: "`binaries` is a `~/`-rooted route and the enumeration reads ~/.local/bin, so a vendor installer or pkg that writes to /usr/local/bin leaves nothing any route reads. Muse Code's muse.pkg does exactly that: its whole payload is /usr/local/bin/muse, read off the expanded package on 2026-10-19. Its curl installer, which is the route the vendor documents, writes ~/.local/bin/muse and is covered"
  - spot: "An NSS-only account whose home directory is outside /home or /root"
    why: "Since osquery 5.13.1 the unconstrained Linux `users` table reads /etc/passwd directly, so an account that only an NSS module knows -- GCE OS Login, SSSD, LDAP, Active Directory -- is not in it. The browser and VS Code branches take their uids from the home directories on disk as well, which covers every such account that has logged in under /home or /root. One whose home was placed elsewhere, or one that has never logged in, is reached by neither list. Read off osquery's linux/users.cpp at 5.23.1"
  - spot: "Which agent installed a systemd unit"
    why: "No unit name is a signature. The macOS launchd prefixes were read off live installs; no Linux unit name has been, so the route carries no values and unit rows stay evidence"
  - spot: "A systemd unit the running manager has not loaded"
    why: "`systemd_units` lists loaded units, not unit files on disk -- unlike macOS's `launchd`. So a unit installed but never started is invisible, and so is anything under `systemctl --user`, which reads a different bus"
  - spot: "A Windows user who is not signed in, on the registry and MSIX routes"
    why: "`HKEY_USERS` holds the hives of signed-in users only, so a per-user Uninstall key, an MSIX package installed for one user, and a browser bridge registered under HKCU are read while that user is signed in and not otherwise. Measured on windows-2025 on 2026-10-26: a second user's Uninstall key was read while a process of theirs ran and was gone once they signed out, while their files were still read. The file, npm, extension and process routes do not depend on a hive"
  - spot: "A Windows profile outside `<drive>:\\Users\\`"
    why: "SPEC.md 6.4.7's Windows home root is `<drive>:\\Users\\<segment>\\`, and the Windows queries read the homes `users` lists under it. A relocated ProfilesDirectory, and SYSTEM's profile under `C:\\Windows\\system32\\config\\`, are outside it, so an agent installed there matches no `~/` value"
  - spot: "Containers on Windows"
    why: "osquery's `docker_*` tables are POSIX only (specs/posix at 5.23.1), so nothing reads an image or a container on Windows. The engine is NAMED instead: `osquery/queries/runtime-windows.sql` looks for Docker, Podman and Rancher Desktop on disk, and its marker reads `unreadable:docker` (or `:podman`, `:rancher-desktop`) rather than `absent`. Measured both ways for Docker on windows-2025, whose Docker Engine runs Windows containers; the other two are their installers' default paths, unmeasured"
  - spot: "An agent inside WSL"
    why: "A WSL distribution is a Linux filesystem in a virtual disk, and osquery on the Windows host reads the host. Nothing names one yet: no distribution has been installed on a runner to read what its presence looks like, so there is no marker for it, and a Windows machine whose agents live in WSL reads as having none"
  - spot: "An npm global prefix moved on Windows"
    why: "`npm_packages` searches `%APPDATA%\\npm` and nvm's directories on Windows (npm_packages.cpp at 5.23.1). A prefix set anywhere else is not read: GitHub's own Windows image moves it to `C:\\npm\\prefix`, where four globals installed on 2026-10-26 produced no row"
  - spot: "A Windows process launched through an 8.3 short path"
    why: "`processes.path` reports the on-disk spelling even for a lowercase or `\\\\?\\` launch, but a launch through a short name keeps it (`C:\\PROGRA~1\\...`), measured on windows-2025. A short name for a home's own components would match no `~/` value"
  - spot: "MSIX packages on osquery below 5.17.0"
    why: "`programs` learned MSIX packages in 5.17.0 (osquery/osquery#8585), so `osquery/queries/programs-windows.sql` declares that floor and returns nothing on an older endpoint, Claude Desktop's identity on Windows with it"
  - spot: "JetBrains plugins on Windows"
    why: "`jetbrains_plugins` reads `%APPDATA%\\JetBrains\\<Product>*\\plugins` on Windows (jetbrains_plugins.h at 5.23.1), and no Windows query or scenario reads it yet, so the route claims macOS and Linux only"
  - spot: "Store-only apps on Windows"
    why: "The CI runner is Windows Server 2025, which has no Microsoft Store, so an agent sold only through the Store, ChatGPT's desktop app among them, cannot be installed there and has no Windows identifier. Claude Desktop is a signed MSIX installed without the Store, and is covered"
  - spot: "Which filesystem roots an MCP server exposes"
    why: "Requires parsing arbitrary JSON config; osquery has no table for it"
  - spot: "Outbound destinations by hostname"
    why: "`process_open_sockets` returns an IP, not a name"
  - spot: "Which agent holds a listening port"
    why: "A port is only attributable when the process holding it already names the agent, so it never identifies anything on its own -- 8080-held-by-java would read as llama.cpp. Ports are collected as evidence and are never a signature"
  - spot: "A cloned-but-never-run source checkout"
    why: "Nothing has been created on disk yet"
  - spot: "What an agent *does*"
    why: "Every route reports presence and declared capability. `permissions` says an extension **may** read every page, never that it did"
  - spot: "The identity of a sideloaded extension"
    why: "osquery derives `identifier` from the manifest `key`, which unpacked and sideloaded extensions do not carry, so they report an empty one. A Web Store CRX does carry it. The row is not anonymous: it carries `unreferenced` when Chrome would not load it, or `sideloaded:` and the manifest's SHA-256 when it would, so a sideload is found by hash rather than by id"
  - spot: "GitHub Copilot inside VS Code"
    why: "Copilot Chat ships BUILT IN (`GitHub.copilot-chat` 0.64.1 in VS Code stable's bundle, measured 2026-09-05), and `vscode_extensions` reads only the user extension directories. The marketplace `github.copilot` cannot be installed over it, because it pins an older `copilot-chat` and VS Code refuses to downgrade a built-in, so no scenario can produce the identifier. Detecting the built-in would report the editor, not a fleet's choice of agent. `copilot-cli` is the Copilot this catalog proves, through npm, Homebrew and the JetBrains plugin"
  - spot: "VS Code extensions on osquery below 5.15.0"
    why: "`vscode_extensions` arrived in 5.11.0 and its `vscode_edition` column, which tells VS Code from Cursor and Windsurf, in 5.15.0. The VS Code queries read both, so they declare 5.15.0, above this repo's 5.10.0 floor, and return nothing on an older endpoint"
  - spot: "JetBrains plugins on osquery below 5.18.0"
    why: "`jetbrains_plugins` arrived in 5.18.0, so `osquery/queries/jetbrains.sql` declares that floor and returns nothing on an older endpoint. The composed artifact is one statement, so on 5.11 to 5.17 it fails whole; `osquery/bin/discover --write` runs the branch on its own and reports it as `error`"
  - spot: "The identity of a JetBrains plugin"
    why: "The table exposes no plugin.xml id, only a display name, a vendor and the path, so the identifier is the plugin's directory name. A plugin whose directory was renamed on disk is not recognised, and a plugin shipped as a bare jar carries its version in the name"
  - spot: "Whether an agent was running a minute ago"
    why: "A `proc` row is a sample of the process table when the query ran, not a history. An agent started and stopped between two runs leaves nothing on this route"
  - spot: "A running node CLI that names no package path"
    why: "A global launched through its bin link reads `node /usr/local/bin/<name>`, and a process that renames itself carries no path at all. `osquery/queries/running.sql` finds OpenClaw's gateway through its workers, which run a script under node_modules/openclaw; a CLI that starts none is found as installed and not as running"
  - spot: "Behaviour that only appears after launch or sign-in"
    why: "Nothing here launches an app -- `open -a` needs an Aqua session and SSH has none -- so first-launch daemons, ports and state directories go unobserved, and account-gated products are never signed in to"
  - spot: "Whether ChatGPT's dots is enabled or in use"
    why: "A dot runs on an OpenAI cloud computer; local computer access is opt-in and runs through the ChatGPT desktop app, which `chatgpt-desktop` already reports (help.openai.com/en/articles/20001554-manage-dots-in-chatgpt-workspaces). No dots-only signal has been read off a real install, so a match means the app, never dots"
