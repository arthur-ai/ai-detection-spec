name: Agent catalog doc

# docs/agents.md is generated from catalog/agents.yaml and the tests that exercise it.
# test/lint.sh gates it on every pull request, so a contributor who changes the catalog
# regenerates the doc in the same commit. This workflow is the SAFETY NET for the paths
# that gate cannot cover: a direct push to main, a merge that changes coverage without
# touching the catalog, and an edit made through the GitHub web UI.
#
# It cannot loop. The paths filter below does not include docs/, so the commit this
# workflow pushes does not re-trigger it.
on:
  push:
    branches: [main]
    paths:
      # catalog/** covers both agents.yaml and routes.yaml. The registry is what the
      # report derives every route name and platform from, so a change there moves the
      # generated page even when no agent moved.
      - 'catalog/**'
      - 'test/fixtures/**'
      - 'test/scenarios/*/expected.json'
      - 'test/scenarios/*/requires.json'
      # Coverage is per identifier now, and this is where a real run's evidence lands.
      # Without it an observation could be committed while the doc kept reporting the
      # coverage that existed before it.
      - 'test/scenarios/*/observed.json'
      - 'bin/classify'
      - 'tools/agent_status.py'
      - 'tools/check_doc_numbers.py'
      # The blind spots are data now, and the report renders them.
      - 'docs/blind-spots.yaml'
      # README still carries the generated coverage badge.
      - 'README.md'
  workflow_dispatch:

# Two pushes in quick succession would otherwise race to commit the same file. The later
# one wins; cancelling the earlier costs nothing because the doc is derived, not accumulated.
concurrency:
  group: agents-doc
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: pip install --quiet pyyaml
      - name: Regenerate the doc
        run: python3 tools/agent_status.py --write
      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then ask --cached. A plain `git diff` reports nothing for a file
          # git is not yet tracking, so on the one run where the doc is newly added this
          # would report "nothing to commit" and silently skip the thing it exists to do.
          git add docs/agents.md docs/limits.md README.md
          if git diff --cached --quiet -- docs/agents.md docs/limits.md README.md; then
            echo "docs/agents.md and docs/limits.md already match the catalog. Nothing to commit."
            exit 0
          fi
          # Separate -m flags, not one indented block: a YAML block scalar keeps its
          # indentation, which would land in the commit body as leading whitespace.
          git commit \
            -m "docs: regenerate agents.md and limits.md from the catalog" \
            -m "Generated by tools/agent_status.py from catalog/agents.yaml and the tests that exercise it. Triggered by ${{ github.sha }}."
          git push
          echo "### Agent catalog doc updated" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/agent_status.py | tail -4 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
