name: Performance

# Times every query against its declared cost band. Runs on macOS because that is
# the only place the queries mean anything, and on every pull request because a
# stall is not something review catches.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel a pull request's superseded runs; NEVER a main or a scheduled one. Pushing five
# times to a branch then costs one suite rather than five, and the runs being cancelled
# are ones whose answer nobody will read. scenarios.yml has had this since it was written
# and these two did not: measured 2026-09-22, six runs over the preceding four days were
# kept alive to completion for no reader. A dated observation, not a standing figure.
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # WHAT THIS DIFF CAN MOVE, decided once and read by the expensive jobs below.
  #
  # A JOB-LEVEL `if`, NOT A WORKFLOW-LEVEL `paths:` FILTER, and the difference is the
  # whole reason this job exists rather than three lines under `on:`. A workflow filtered
  # out by `paths` never reports a check at all -- it vanishes from the pull request's
  # list, leaving every remaining check green, which is precisely the failure
  # tools/check_workflows.py was written for and which that file calls worse than a red
  # build. A job whose `if` is false reports SKIPPED: visible in the list, and counted as
  # passing by a required status check rather than blocking it forever.
  #
  # The rule itself is in tools/ci_scope.py, in ONE place, because three workflows ask
  # this question and three copies of the answer would be three lists that have to agree.
  scope:
    name: What this diff can move
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs the base commit, not just the tip. The whole repo is 5MB.
          fetch-depth: 0
      - id: scope
        env:
          # On a pull request github.sha is a merge commit onto main's CURRENT tip, which is
          # its first parent. pull_request.base.sha can be older: run 37833949373 still had
          # it at 407181a after a collect commit moved main, and scoped a two-file docs PR
          # by 28 observed.json files it never touched. `before` is the previous tip on a
          # push and all-zeros on a force-push or a branch's first push; ci_scope.py reads
          # that as "cannot tell" and runs.
          BASE: ${{ github.event_name == 'pull_request'
                    && format('{0}^1', github.sha) || github.event.before }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # A schedule or a manual dispatch has no diff to read, and a dispatch is
          # somebody asking for this on purpose. Both run everything.
          case "$EVENT" in
            pull_request|push) ;;
            *) echo "runtime=true" >> "$GITHUB_OUTPUT"
               echo "$EVENT has no diff to read; running every gate"
               exit 0 ;;
          esac
          python3 tools/ci_scope.py "$BASE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          # AN EMPTY OUTPUT IS THE ONE FAILURE THIS GATE COULD HIDE. A false `if` and an
          # unset output are the same string to GitHub, so a scope job that succeeded
          # while writing nothing would skip the whole suite and report green -- an empty
          # result indistinguishable from a clean one, in the place that decides whether
          # anything gets checked at all. A crash is already red; this covers the rest.
          grep -qE '^runtime=(true|false)$' "$GITHUB_OUTPUT" || {
            echo "::error::ci_scope.py wrote no verdict. Refusing to skip the suite on"
            echo "::error::a gate that did not answer."
            exit 1
          }
          grep '^runtime=' "$GITHUB_OUTPUT"

  budgets:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Cost bands on macOS
    # Pinned: image reissues change the baseline, and that drift should be caught
    # rather than silently absorbed.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install osquery
        run: |
          curl --retry 3 -fsSL -o /tmp/osquery.pkg https://pkg.osquery.io/darwin/osquery-5.23.1.pkg
          sudo installer -pkg /tmp/osquery.pkg -target /

      # The runner ships Xcode, Homebrew, four browsers, Node and Python, so it is a
      # loaded machine rather than an empty one. An empty baseline is not a valid
      # baseline: it is the state that hid the docker stall.
      - name: Record the baseline machine
        run: |
          echo "runner: $(sw_vers -productVersion) $(uname -m)"
          echo "apps:   $(ls -d /Applications/*.app 2>/dev/null | wc -l | tr -d ' ')"
          echo "brew:   $(brew list --formula 2>/dev/null | wc -l | tr -d ' ') formulae"

      - name: Enforce cost bands
        run: sudo -n python3 tools/measure.py --check

      # A daemon that is installed but not answering is the worst case for any query
      # that touches one, and it is invisible on a machine where the daemon is simply
      # absent. The hosted runner has no Docker, so this asserts the absent case only;
      # the stopped and mid-startup cases need a local or self-hosted run.
      - name: Confirm no query blocks on an absent dependency
        run: |
          test ! -S /var/run/docker.sock || echo "note: a docker socket exists on this runner"
          sudo -n python3 tools/measure.py --json > /tmp/perf.json
          python3 tools/check_output.py /tmp/perf.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance
          path: /tmp/perf.json

  # THE LINUX BANDS, MEASURED. Every query declares a cost band and tools/measure.py is
  # what holds it -- so a Linux query whose band nothing ever measured is a declaration
  # with no enforcement, which is the same class of claim as an identifier no test can
  # produce.
  #
  # One number here is genuinely unknown until this runs: queries/runtime-linux.sql
  # enumerates EVERY systemd unit with no vendor exclusion, because Linux has no
  # `com.apple.%` equivalent and `fragment_path` would drop exactly the packaged agent the
  # branch is for. macOS goes from 937 launchd jobs to 47 with its exclusion; the Linux
  # row count is unmeasured, and this job is what produces it. If it is large, the filter
  # decision gets made against evidence rather than by analogy.
  linux:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Cost bands on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install osquery
        run: |
          curl --retry 3 -fsSL -o /tmp/osquery.deb \
            https://pkg.osquery.io/deb/osquery_5.23.1-1.linux_amd64.deb
          sudo dpkg -i /tmp/osquery.deb
      - name: Record the baseline machine
        # A LOADED MACHINE IS THE ONLY VALID BASELINE. An empty one is the state that hid
        # the docker stall: a query that is slow only when it has rows to return measures
        # fine on a runner with nothing installed.
        run: |
          . /etc/os-release && echo "$PRETTY_NAME  $(uname -m)"
          echo "deb packages: $(dpkg-query -f '.\n' -W | wc -l)"
          echo "systemd units: $(systemctl list-unit-files --no-legend 2>/dev/null | wc -l)"
          echo "desktop entries: $(ls /usr/share/applications/*.desktop 2>/dev/null | wc -l)"
      - name: Enforce the declared bands
        run: python3 tools/measure.py --check
      - name: Publish the numbers
        if: always()
        run: |
          python3 tools/measure.py --json > /tmp/perf-linux.json || true
          cat /tmp/perf-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-linux
          path: /tmp/perf-linux.json
