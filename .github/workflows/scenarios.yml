name: Scenarios

# Installs real software on a throwaway runner and asserts what the query finds.
#
# RUNS PER PULL REQUEST. It did not, and the reason it did not -- macOS runner minutes --
# was the wrong thing to optimise: a signature is the one kind of change in this repo whose
# correctness CANNOT be checked statically. lint proves the SQL is well-formed and the
# catalog is consistent; only a real install proves an identifier is what the software
# ships. Landing a signature on the strength of a green lint is how `bot.molt.mac` got in.
#
# The cost is real and is bounded rather than avoided:
#
#   * `concurrency` below cancels a PR's superseded runs, so pushing five times to a
#     branch costs one suite and not five.
#   * `fail-fast: false` on every matrix, so one flaky download reports one red job
#     instead of hiding the other twenty.
#   * the `collect` job stays main-only, so a PR run asserts and uploads without
#     committing observations. A PR must not be able to move recorded coverage.
#   * the `scope` job below runs only the scenarios a diff can move -- none for a `.md`
#     file -- and excludes the rest from each matrix. tools/ci_scope.py holds the rules.
#   * every job declares `timeout-minutes`, and tools/check_workflows.py fails one that
#     does not. The default is 360, and 50-autonomous on macos-26 billed all of it four
#     times between 2026-10-15 and 10-18, hung in Provision.
#
# A CHANGE THAT CAN MOVE A SIGNATURE STILL RUNS HERE, never skipped on a green lint: a
# catalog edit runs the scenarios that name, observed or probe the agents it changed. The
# one miss scoping leaves is a new signature over-matching rows in a scenario with no
# link to its agent, and the schedule runs every scenario weekly, so that surfaces within
# a week.
#
# Measured 2026-09-22 over the preceding four days: 93% of this repository's billable
# minutes were this workflow. Measured 2026-10-19: the last 40 merges to main, replayed
# through the scope job, would have run 58% of their macOS jobs. Dated observations, not
# standing claims -- re-measure before quoting them.
on:
  pull_request:
  push:
    branches: [main]
  # Mondays, 06:00 UTC. Nightly bounded the scoping miss at a day; cut to weekly on
  # 2026-10-20 for cost. A dispatch runs the full suite any time it is needed sooner.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      scenarios:
        description: >-
          Scenario names, space-separated. Empty runs every scenario; names run only
          those, on every job that lists them -- the way to rerun one scenario rather
          than an image's whole list.
        required: false
        default: ""

# Cancel superseded PR runs, NEVER a main or scheduled one. A cancelled main run loses the
# observations `collect` would have committed, and a lost observation reads downstream as
# an identifier that stopped appearing.
#
# SO A RUN THAT IS NOT A PULL REQUEST'S GETS A GROUP OF ITS OWN. A group holds one pending
# run, and a newer arrival cancels it whatever cancel-in-progress says. That cost nothing
# while every main run was the whole suite; now a push runs only what its own diff can
# move, so a cancelled pending push loses its scenarios for good, and the weekly run that
# backs the scoping could be cancelled by any push queued behind it.
concurrency:
  group: scenarios-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Declared rather than left to the repository default. collect pushes with a deploy key,
# not this token.
permissions:
  contents: read

env:
  # One version for all three package names below.
  OSQUERY_VERSION: 5.23.1

jobs:
  # WHAT THIS DIFF CAN MOVE, decided once and read by the expensive jobs below.
  #
  # A JOB-LEVEL `if`, NOT A WORKFLOW-LEVEL `paths:` FILTER, and the difference is the
  # whole reason this job exists rather than three lines under `on:`. A workflow filtered
  # out by `paths` never reports a check at all -- it vanishes from the pull request's
  # list, leaving every remaining check green, which is precisely the failure
  # tools/check_workflows.py was written for and which that file calls worse than a red
  # build. A job whose `if` is false reports SKIPPED: visible in the list, and counted as
  # passing by a required status check rather than blocking it forever.
  #
  # The rule itself is in tools/ci_scope.py, in ONE place, because three workflows ask
  # this question and three copies of the answer would be three lists that have to agree.
  #
  # THIS ONE ASKS WHICH SCENARIOS, not whether, and answers per job: `skip_<job>` when
  # none of its scenarios run, `exclude_<job>` naming the ones a matrix job drops,
  # `run_<job>` naming the ones a harness job runs. AN EXCLUDED SCENARIO VANISHES FROM
  # THE CHECKS LIST, which is the failure the paragraph above refuses for a whole workflow
  # -- so this job's summary names every path, the rule that scoped it and what it
  # selected, and that is where to look for a scenario that did not run. An UNSET output
  # runs everything -- `skip_` is not 'true', `exclude_` falls back to [], an empty `run_`
  # is the harness's run-everything form -- so the weekly run needs no Python here, and a
  # pull request or push refuses to finish this job without them.
  scope:
    name: What this diff can move
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      skip_scenario: ${{ steps.scope.outputs.skip_scenario }}
      exclude_scenario: ${{ steps.scope.outputs.exclude_scenario }}
      skip_scenario_linux: ${{ steps.scope.outputs.skip_scenario_linux }}
      exclude_scenario_linux: ${{ steps.scope.outputs.exclude_scenario_linux }}
      skip_scenario_linux_container: ${{ steps.scope.outputs.skip_scenario_linux_container }}
      run_scenario_linux_container: ${{ steps.scope.outputs.run_scenario_linux_container }}
      skip_scenario_windows: ${{ steps.scope.outputs.skip_scenario_windows }}
      exclude_scenario_windows: ${{ steps.scope.outputs.exclude_scenario_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs the base commit, not just the tip. The whole repo is 5MB.
          fetch-depth: 0
      # The catalog and this workflow are compared parsed, not as text.
      - name: Install pyyaml
        # Not on the schedule, which must not depend on Python here (see the step below).
        if: github.event_name != 'schedule'
        run: pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml
      - id: scope
        env:
          # On a pull request github.sha is a merge commit onto main's CURRENT tip, which is
          # its first parent. pull_request.base.sha can be older: run 37833949373 still had
          # it at 407181a after a collect commit moved main, and scoped a two-file docs PR
          # by 28 observed.json files it never touched. `before` is the previous tip on a
          # push and all-zeros on a force-push or a branch's first push; ci_scope.py reads
          # that as "cannot tell" and runs.
          BASE: ${{ github.event_name == 'pull_request'
                    && format('{0}^1', github.sha) || github.event.before }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          # Empty on every event but a dispatch that named scenarios.
          ONLY: ${{ inputs.scenarios }}
        run: |
          # A schedule or a manual dispatch has no diff to read, and a dispatch is
          # somebody asking for this on purpose. Both run every scenario, and with nothing
          # but one line: the weekly run is what catches what scoping cannot, so it must
          # not depend on the scoping working. A dispatch that NAMES scenarios runs those
          # alone, on every job that lists them: the way to rerun one scenario after a
          # transient rather than an image's whole list. A name no job lists fails this
          # job rather than running nothing.
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$ONLY" ]; then
            # ONLY is a space-separated list, split on purpose.
            # shellcheck disable=SC2086
            python3 tools/ci_scope.py --scenarios --summary "$GITHUB_STEP_SUMMARY" \
              --only $ONLY >> "$GITHUB_OUTPUT"
          else
            case "$EVENT" in
              pull_request|push)
                python3 tools/ci_scope.py --scenarios "$BASE" "$HEAD_SHA" \
                  --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT" ;;
              *) echo "runtime=true" >> "$GITHUB_OUTPUT"
                 echo "$EVENT has no diff to read; running every scenario"
                 exit 0 ;;
            esac
          fi
          # AN EMPTY OUTPUT IS THE ONE FAILURE THIS GATE COULD HIDE. A false `if` and an
          # unset output are the same string to GitHub, so a scope job that succeeded
          # while writing nothing would skip the whole suite and report green -- an empty
          # result indistinguishable from a clean one, in the place that decides whether
          # anything gets checked at all. A crash is already red; this covers the rest.
          grep -qE '^runtime=(true|false)$' "$GITHUB_OUTPUT" \
            && grep -qE '^(exclude|run)_' "$GITHUB_OUTPUT" || {
            echo "::error::ci_scope.py wrote no verdict. Refusing to skip the suite on"
            echo "::error::a gate that did not answer."
            exit 1
          }
          grep -E '^(runtime|skip_)' "$GITHUB_OUTPUT"

  scenario:
    needs: scope
    if: needs.scope.outputs.runtime == 'true' && needs.scope.outputs.skip_scenario != 'true'
    name: ${{ matrix.scenario }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Above Provision's own bound, so a hang there fails in that step, with its name.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # THE OS IS AN AXIS, NOT PART OF A SCENARIO'S NAME. A scenario is a subject --
        # what software, installed how -- and the platform it ran on travels with the
        # OBSERVATION instead. Encoding it in directory names would mean one copy of every
        # scenario per OS, edited in lockstep whenever a signature moves.
        #
        # TWO LABELS, so observed.json records which macOS version produced each identifier
        # and a signature that appears on one and not the other is visible rather than
        # averaged away.
        #
        # PINNED, never macos-latest: a floating label changes the OS under every observation
        # with no diff here. macos-14 left when GitHub retired it (2026-11-02); its records
        # stay in observed.json. Replace a retired label rather than drop it.
        os: [macos-15, macos-26]
        scenario:
          - 00-baseline
          - 10-desktop-apps
          - 11-perplexity-desktop
          - 12-chatgpt-pre-rename
          - 13-desktop-apps-more
          - 14-meta-muse
          - 20-cli-agents
          - 21-cli-agents-homebrew
          - 25-python-agents
          - 30-ide-agents
          - 40-browser
          - 45-claude-extension
          - 50-autonomous
          - 55-openclaw-npm
          - 56-openclaw-retired-names
          - 57-clawdbot-era
          - 60-persistence
        # The scenarios this diff cannot move. The lists above stay the whole suite, which
        # is what tools/check_workflows.py checks and what the schedule runs.
        exclude: ${{ fromJSON(needs.scope.outputs.exclude_scenario || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install osquery
        # --retry-all-errors as well as --retry: on its own curl retries only timeouts
        # and 5xx, and `curl: (7) Couldn't connect` failed a run on 2026-10-20 after one
        # attempt. The same flags on the two Linux installs below.
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 5 -fsSL -o /tmp/osquery.pkg \
            "https://pkg.osquery.io/darwin/osquery-${OSQUERY_VERSION}.pkg"
          sudo installer -pkg /tmp/osquery.pkg -target /
      # bin/classify reads the catalog, and assert.sh runs it: the query enumerates, so
      # "did we find OpenClaw" is answered by the matcher, not by a row count.
      - name: Install pyyaml
        run: pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml

      # A SCENARIO CAN BE UNRUNNABLE HERE RATHER THAN BROKEN, and until now only the VM
      # harness knew that. test/run.sh has read requires.json since it was written -- CI
      # never did, so adding a second macOS turned two honest "cannot run on this version"
      # facts into two red jobs, which is how a suite teaches people to ignore it.
      - name: Can this scenario run on this runner?
        id: runnable
        run: |
          req="test/scenarios/${{ matrix.scenario }}/requires.json"
          need=0
          [ -f "$req" ] && need=$(python3 -c "import json;print(json.load(open('$req')).get('min_macos',0))")
          have=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$have" -lt "$need" ]; then
            echo "runnable=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: needs macOS >= $need, this runner is $have"
            python3 -c "import json;print('  '+json.load(open('$req')).get('why',''))"
            echo "### SKIPPED on macOS $have" >> "$GITHUB_STEP_SUMMARY"
            echo "Needs macOS $need or newer. This is a fact about the runner, not a defect." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "runnable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision
        # id, so the two always() steps at the foot of this job can ask whether there was
        # ever a query to measure. The Linux job's Provision has carried one since it was
        # written; this one did not, which is the whole of the bug described down there.
        id: provision
        if: steps.runnable.outputs.runnable == 'true'
        # BOUNDED ABOVE THE SLOWEST PROVISION THAT SUCCEEDED: 43.8 minutes, 10-desktop-apps
        # on 2026-09-29, a slow-download day. A tighter bound fails a slow mirror as a hang.
        timeout-minutes: 50
        run: test/scenarios/${{ matrix.scenario }}/setup.sh
      - name: Query and assert
        if: steps.runnable.outputs.runnable == 'true'
        run: |
          sudo -n /usr/local/bin/osqueryi --json < osquery/dist/discovery-darwin.sql > /tmp/out.json
          test/assert.sh /tmp/out.json test/scenarios/${{ matrix.scenario }}/expected.json

      # These runners install the REAL software, so this job's output is real-install
      # evidence -- the same grade test/run.sh records from a VM. Recording it here keeps
      # docs/agents.md's per-identifier coverage current without anyone remembering to run
      # VMs locally and commit the result.
      #
      # Uploaded rather than committed: eleven matrix jobs pushing to the same branch would
      # race, and the loser's observation would be lost silently. The collect job below
      # merges them and commits once.
      - name: Record which identifiers this run matched
        if: steps.runnable.outputs.runnable == 'true'
        run: |
          python3 tools/agent_status.py --record /tmp/out.json \
            test/scenarios/${{ matrix.scenario }} \
            --platform darwin --os "$(sw_vers -productVersion)" --arch "$(uname -m)" \
            --run-id "${{ github.run_id }}"
      - name: Upload the observation
        if: steps.runnable.outputs.runnable == 'true'
        uses: actions/upload-artifact@v4
        with:
          # THE OS IS IN THE NAME. Two jobs per scenario now, and upload-artifact@v4 fails
          # outright on a duplicate name -- so without this the second platform's upload
          # errors and its evidence is lost.
          name: observed-${{ matrix.scenario }}--${{ matrix.os }}
          path: test/scenarios/${{ matrix.scenario }}/observed.json
          if-no-files-found: error

      # Enumeration trades payload for not being wrong about the catalog, so the payload
      # is now a number worth watching per scenario rather than once on a developer Mac.
      #
      # always() AND runnable AND PROVISION SUCCEEDED, not always() alone.
      #
      # always() includes SKIPPED, so on a runner the scenario cannot use, this measured a
      # /tmp/out.json that no step ever wrote and turned an honest skip into a red job --
      # which is what the runnable gate exists to prevent. The always() half still earns
      # its place: when the ASSERT fails the query did run, and the payload of a failing
      # run is the number worth having.
      #
      # runnable=true was not enough, because it says only that the runner could HOST the
      # scenario -- nothing about whether setup.sh got far enough to leave anything behind.
      # Run 34342254845: openclaw's npm install refused the runner's Node 22, Provision
      # failed, the query never ran, and this step then failed with
      # `FileNotFoundError: /tmp/out.json`. Two red steps, and the second one named a
      # missing file rather than the install that was actually broken. A job that fails
      # once should say so once, at the step that failed.
      #
      # `outcome`, not `conclusion`: both are 'success' here, but outcome is the step's own
      # result before continue-on-error could rewrite it, and it is 'skipped' rather than
      # empty when the runnable gate already stopped Provision -- so this stays correct if
      # that gate ever moves.
      - name: Measure the payload
        if: always() && steps.runnable.outputs.runnable == 'true'
          && steps.provision.outcome == 'success'
        run: python3 osquery/tools/measure_payload.py /tmp/out.json
      - name: Keep the output
        # THE SAME CONDITION, deliberately. This one merely warns on a missing file rather
        # than failing, so it stayed green through the run above -- it uploaded an empty
        # artifact instead. Keeping the two conditions identical means the pair cannot
        # drift into disagreeing about when a payload exists.
        if: always() && steps.runnable.outputs.runnable == 'true'
          && steps.provision.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          # THE OS IS IN THE NAME, as it is for the observation above. Two jobs per scenario
          # upload this one, and run 33476286840 shows both landing under the bare scenario
          # name -- two artifacts, one name, and no way to tell which macOS produced the
          # output you just downloaded. That is not a failure, it is worse: an ambiguity that
          # reads as a single answer.
          name: ${{ matrix.scenario }}--${{ matrix.os }}
          path: /tmp/out.json

  # One job after the matrix, so the commit happens once rather than eleven times.
  # --- LINUX ---------------------------------------------------------------------------
  #
  # A SECOND JOB RATHER THAN A THIRD LABEL IN THE MATRIX ABOVE. The OS is an axis, but it
  # is a SPARSE one: a scenario that installs Homebrew casks cannot run on Ubuntu and a
  # scenario that installs a .deb cannot run on a Mac, so a full cross-product would be
  # mostly jobs that exist to be skipped. Each scenario declares its platform in
  # expected.json and appears under the job that can run it -- and
  # tools/check_workflows.py asserts that pairing in both directions, so a Linux scenario
  # listed only here cannot silently stop being run, and one listed nowhere fails the build.
  #
  # NO VM LAYER. The macOS scenarios run directly on the hosted runner too -- Tart is only
  # the local path, test/run.sh -- so Linux needs nothing new: a hosted ubuntu-24.04 has
  # systemd as PID 1, which is what 76-linux-systemd needs and what a container cannot give.
  scenario-linux:
    needs: scope
    if: needs.scope.outputs.runtime == 'true' && needs.scope.outputs.skip_scenario_linux != 'true'
    name: ${{ matrix.scenario }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The slowest Linux scenario job from 2026-09-28 to 10-19 took 12.8 minutes, most of
    # it one download; this job and the container one share the bound.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # arm64 as well, because a large share of EC2 fleets run on Graviton. A scenario
        # whose software ships no arm64 build says so by exiting 3, as it would on a Mac.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        scenario:
          - 70-linux-baseline
          - 71-linux-cli-agents
          - 72-linux-python-agents
          - 73-linux-deb
          - 74-linux-dpkg-removed
          - 75-linux-browser
          - 76-linux-systemd
          - 78-linux-vscode
          - 79-linux-image
          - 80-linux-jetbrains
          - 81-linux-bun
          - 82-linux-running
          - 83-linux-claude-running
          - 84-linux-installers
          - 85-linux-vscode-agents
          - 86-linux-jetbrains-agents
          - 87-linux-pi
          - 88-linux-pi-legacy
          - 89-linux-claude-deb
          - 92-linux-browser-agents
          - 93-linux-cli-agents-more
          - 94-linux-cli-agents-legacy
          - 95-linux-crush-packages
          - 96-linux-cli-agents-npm
          # 77-linux-rpm and 91-linux-claude-rpm need dnf, which no ubuntu label has, so
          # they are under the container job only. A scenario listed where it can never
          # run spends a runner on exiting 3; tools/check_workflows.py still fails one
          # listed nowhere.
        exclude: ${{ fromJSON(needs.scope.outputs.exclude_scenario_linux || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install osquery
        run: |
          # The deb, not the pkg. Both the deb and the rpm install osqueryi to
          # /usr/bin/osqueryi -- verified on Ubuntu 24.04 and Fedora 41 -- which is the
          # path osquery/bin/container-scan's osqueryi_path() now looks for. The runner's own
          # architecture names the package, amd64 or arm64.
          curl --retry 3 --retry-all-errors --retry-delay 5 -fsSL -o /tmp/osquery.deb \
            "https://pkg.osquery.io/deb/osquery_${OSQUERY_VERSION}-1.linux_$(dpkg --print-architecture).deb"
          sudo dpkg -i /tmp/osquery.deb
          osqueryi --version
      - name: Install pyyaml
        run: pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml

      # A scenario can be unrunnable here rather than broken, exactly as on macOS. The
      # Linux axis is `min_kernel` where it is used at all -- most of these skip on a
      # FACT ABOUT THE RUNNER instead, by exiting 3 from setup.sh, because the things that
      # stop them (no Chrome for arm64, no system dbus in a container) cannot be known
      # before the script runs.
      - name: Provision
        id: provision
        run: |
          set +e
          test/scenarios/${{ matrix.scenario }}/setup.sh
          rc=$?
          set -e
          # EXIT 3 IS SKIP, and it is the same contract test/run.sh has used since it was
          # written. A scenario that fails where nobody can act on it trains people to
          # ignore a red suite.
          if [ "$rc" = 3 ]; then
            echo "runnable=false" >> "$GITHUB_OUTPUT"
            echo "### SKIPPED: the scenario reported this runner cannot host it" \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          else
            echo "runnable=true" >> "$GITHUB_OUTPUT"
          fi
      # THE ARTIFACT IS CHOSEN BY THE SCENARIO, because one of them asserts on a kind no
      # composed artifact carries. containers.sql is `expensive` and lives only in
      # osquery/dist/discovery-deep.sql, so a scenario that pulls a container image has nothing to
      # assert against unless the deep artifact runs -- and the only supported way to run
      # it is osquery/bin/container-scan, behind osquery/bin/discover --deep, because that artifact can
      # block forever and the bound lives in the runner. Declared in expected.json rather
      # than by scenario name here: a name-matched `if` in a workflow is a list that has to
      # agree with the tree, which is the drift catalog/routes.yaml exists to end.
      #
      # tools/check_workflows.py asserts a `deep: true` scenario is under a job that
      # honours it. Without that, a misplaced one would run the composed artifact and fail
      # on the image count -- a real failure, but on a runner instead of at lint.
      - name: Query and assert
        if: steps.provision.outputs.runnable == 'true'
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('test/scenarios/${{ matrix.scenario }}/expected.json')).get('deep') else 1)"; then
            sudo -n osquery/bin/discover --deep > /tmp/out.json
          else
            sudo -n /usr/bin/osqueryi --json < osquery/dist/discovery-linux.sql > /tmp/out.json
          fi
          test/assert.sh /tmp/out.json test/scenarios/${{ matrix.scenario }}/expected.json
      - name: Record which identifiers this run matched
        if: steps.provision.outputs.runnable == 'true'
        run: |
          # --platform, alongside --os and --arch. `os` alone holds "24.04", which names a
          # distro release and not a platform family, so coverage could not be counted per
          # platform without it.
          # --os CARRIES THE DISTRO AND ITS RELEASE, `ubuntu-24.04`, because the record is
          # read beside Debian's `12` and Rocky's `9.x` now and a bare number names a
          # distro only to a reader who already knows whose numbering it is. The same
          # expression runs in the container job and in test/run-linux.sh.
          python3 tools/agent_status.py --record /tmp/out.json \
            test/scenarios/${{ matrix.scenario }} \
            --platform linux --os "$(. /etc/os-release && echo "$ID-$VERSION_ID")" \
            --arch "$(uname -m)" --run-id "${{ github.run_id }}"
      - name: Upload the observation
        if: steps.provision.outputs.runnable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: observed-${{ matrix.scenario }}--${{ matrix.os }}
          path: test/scenarios/${{ matrix.scenario }}/observed.json
          if-no-files-found: error

  # WINDOWS, on GitHub's hosted Server 2025, one scenario per runner as on macOS. The
  # workflow's own plumbing runs in Git Bash: `<` works, GITHUB_OUTPUT stays UTF-8 (Windows
  # PowerShell 5.1 writes UTF-16 with `>>`), and test/assert.sh runs unchanged. Only a
  # scenario's setup.ps1 runs in PowerShell, the language a Windows installer speaks; its
  # helpers are test/lib/guest-windows.ps1. What the runner looks like to osquery was read
  # off it before any of this was written (survey runs 40393754308 and 40396366136).
  scenario-windows:
    needs: scope
    if: needs.scope.outputs.runtime == 'true' && needs.scope.outputs.skip_scenario_windows != 'true'
    name: ${{ matrix.scenario }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The survey's slowest install, VS Code and five extensions, took under two minutes, so
    # this is a ceiling for a hang rather than a budget.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # read_text() without an encoding is cp1252 on Windows, and the catalog is UTF-8.
      PYTHONUTF8: "1"
      # Forward slashes, which Git Bash, Python and PowerShell all take.
      OSQI: "C:/Program Files/osquery/osqueryi.exe"
    strategy:
      fail-fast: false
      matrix:
        # Pinned, as the macOS labels are: a moving label changes the machine every scenario
        # is measured on without a diff to show it.
        os: [windows-2025]
        scenario:
          - 100-windows-baseline
          - 101-windows-cli-agents
          - 102-windows-claude-native
          - 103-windows-vscode-agents
          - 104-windows-browser
          - 105-windows-desktop-apps
          - 106-windows-python-agents
        exclude: ${{ fromJSON(needs.scope.outputs.exclude_scenario_windows || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install osquery
        shell: powershell
        run: |
          $msi = "$env:RUNNER_TEMP\osquery.msi"
          curl.exe --retry 3 --retry-all-errors --retry-delay 5 -fsSL -o $msi "https://pkg.osquery.io/windows/osquery-$env:OSQUERY_VERSION.msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP\msi.log`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 40; exit 1 }
          & $env:OSQI --version
      - name: Install pyyaml
        run: python -m pip install --quiet pyyaml

      # EXIT 3 IS SKIP, as on Linux. -File exits 0 when a script falls off its end, which is
      # why every setup.ps1 ends in an explicit `exit`.
      - name: Provision
        id: provision
        run: |
          set +e
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "test/scenarios/${{ matrix.scenario }}/setup.ps1"
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "runnable=false" >> "$GITHUB_OUTPUT"
            echo "### SKIPPED: the scenario reported this runner cannot host it" \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          else
            echo "runnable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Query and assert
        if: steps.provision.outputs.runnable == 'true'
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/out.json"
          "$OSQI" --json < osquery/dist/discovery-windows.sql > "$out"
          test/assert.sh "$out" test/scenarios/${{ matrix.scenario }}/expected.json
      # --os is the edition, release and build, not the monthly update revision, which would
      # split one OS into twelve records a year. --arch is the machine's, read where x64
      # emulation cannot rename it, in uname's spelling. Here rather than in
      # test/lib/guest-windows.ps1, which only setup scripts may reach (tools/ci_scope.py).
      - name: Which Windows this is
        if: steps.provision.outputs.runnable == 'true'
        shell: powershell
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $edition = if ($cv.InstallationType -eq 'Server') { 'server' } else { 'client' }
          $release = if ((Get-CimInstance Win32_OperatingSystem).Caption -match '(20\d\d|10|11)\b') { $Matches[1] } else { 'unknown' }
          $native = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment').PROCESSOR_ARCHITECTURE
          $arch = @{ AMD64 = 'x86_64'; ARM64 = 'arm64' }[$native]
          if (-not $arch) { $arch = $native.ToLower() }
          "WIN_OS=windows-$edition-$release-$($cv.CurrentBuild)", "WIN_ARCH=$arch" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record which identifiers this run matched
        if: steps.provision.outputs.runnable == 'true'
        run: |
          python3 tools/agent_status.py --record "$(cygpath -u "$RUNNER_TEMP")/out.json" \
            test/scenarios/${{ matrix.scenario }} \
            --platform windows --os "$WIN_OS" --arch "$WIN_ARCH" --run-id "${{ github.run_id }}"
      - name: Upload the observation
        if: steps.provision.outputs.runnable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: observed-${{ matrix.scenario }}--${{ matrix.os }}
          path: test/scenarios/${{ matrix.scenario }}/observed.json
          if-no-files-found: error

  # THE OTHER FAMILIES, in containers on an ubuntu runner, because GitHub offers no Debian
  # or RHEL-family runner. A matrix of images because the Linux artifact had been proved
  # on one distro while a Compute Engine fleet boots three: Debian 12 by default, Ubuntu
  # LTS by choice, Rocky or RHEL 9 where a policy says so. An EC2 fleet boots Amazon Linux
  # 2023 by default, which is Fedora-derived but carries its own package set. fedora:41
  # stays as the rpm control it has been.
  #
  # WHAT IT REALLY GUARDS is that ONE osquery/dist/discovery-linux.sql serves every family: the
  # artifact names deb_packages and rpm_packages, and the absent one has to return no
  # rows rather than error the statement. A genuinely missing table does the opposite --
  # snap_packages returns [] and exits 1 -- so these are the runs that keep the
  # difference honest.
  #
  # ONE JOB PER IMAGE, NOT ONE PER (SCENARIO, IMAGE). This was a 76-cell matrix on
  # GitHub's `container:`, one VM per cell, each pulling the image and installing the
  # prerequisites to run a thirty-second scenario -- and an organisation on the Free plan
  # has 20 concurrent jobs, so the cells were still starting twenty minutes into a run
  # (39387524313, 2026-10-20). test/run-linux.sh runs the same scenarios on one runner,
  # one fresh container each from an image prepared once; the container is still the
  # clean host, so what each scenario proves is unchanged. One check per image rather
  # than per scenario is the price: a red job names the scenario in its log and summary,
  # and rerunning it reruns the image's list.
  #
  # NO SCENARIO LIST HERE. `SCENARIO_PLATFORM` below tells tools/ci_scope.py,
  # tools/check_workflows.py and tools/agent_status.py that this job runs every Linux
  # scenario on disk, so a new one is in it the moment its directory exists, and the scope
  # job hands it the names a diff can move through `run_scenario_linux_container`. Unset,
  # as on the weekly run, the harness runs them all. 76-linux-systemd and 79-linux-image
  # exit 3 in seconds against the prepared image; they run for real on the ubuntu job
  # above and on a real VM through test/run-gce.sh.
  scenario-linux-container:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
      && needs.scope.outputs.skip_scenario_linux_container != 'true'
    name: Linux scenarios on ${{ matrix.label }}
    runs-on: ubuntu-24.04
    # The sum of its scenarios rather than one of them: the 2026-10-20 cells added up to
    # about sixteen minutes per image. Room for a slow mirror, none for a hang.
    timeout-minutes: 45
    env:
      SCENARIO_PLATFORM: linux
    strategy:
      fail-fast: false
      matrix:
        # PINNED TO A MAJOR, NOT A POINT RELEASE, because that is what a GCE image family
        # is: `debian-12` and `rocky-linux-9` move with the point release underneath,
        # and the record carries the exact one through --os. quay.io for Rocky because
        # Docker Hub's `rockylinux` library image stopped at 9.3; the Rocky project's
        # own repository tracks the current point release. A label per image, because an
        # artifact name may not contain `:` or `/` and upload-artifact@v4 fails outright
        # on one that does.
        include:
          - image: "debian:12"
            label: debian-12
          - image: "quay.io/rockylinux/rockylinux:9"
            label: rocky-9
          - image: "fedora:41"
            label: fedora-41
          - image: "amazonlinux:2023"
            label: amazonlinux-2023
    steps:
      - uses: actions/checkout@v4
      # The prerequisites, the osquery download and its retries live in the harness, once
      # per image per run; OSQUERY_VERSION reaches it from the workflow env above.
      - name: Run the scoped scenarios, one fresh container each
        env:
          LINUX_IMAGE: ${{ matrix.image }}
          SCENARIOS: ${{ needs.scope.outputs.run_scenario_linux_container }}
          OBSERVED_OUT: ${{ runner.temp }}/observed
          OBSERVED_LABEL: ${{ matrix.label }}
        # Unquoted on purpose: the names are one space-separated list, and an empty one is
        # the no-argument form, which runs every Linux scenario.
        run: test/run-linux.sh $SCENARIOS
      # always(): a scenario that failed must not cost the others their evidence. The
      # harness stages only the scenarios that passed, so a job where none did uploads
      # nothing, and `warn` keeps that from being a second red beside the first.
      - name: Upload the observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observed-${{ matrix.label }}
          path: ${{ runner.temp }}/observed
          if-no-files-found: warn

  collect:
    name: Coverage, and commit observations on main
    needs: [scope, scenario, scenario-linux, scenario-linux-container, scenario-windows]
    # always() so a green scenario's observation still lands when a DIFFERENT scenario
    # failed. Each observation is independent evidence, and discarding all of them because
    # one scenario broke would throw away the runs that worked.
    #
    # IT RUNS ON EVERY REF NOW, and only the COMMIT is main-only. Those were one thing and
    # had to become two. Recording coverage on a pull request would let a PR move its own
    # figures, which is why the commit is gated -- but CHECKING coverage was gated with it
    # by accident, leaving the check to test/lint.sh, which can only read observations
    # committed before the branch existed. Every PR that added a signature was therefore
    # red however correct it was, and the only way through was to merge it.
    #
    # So the check moved here, where this run's own observations exist, and lint keeps the
    # half it can answer statically. tools/agent_status.py's _pending() has the split.
    # AND THE SCOPE GATE, because always() INCLUDES SKIPPED. With the matrix gated,
    # always() alone would run this against zero downloaded observations: the merge
    # would be a no-op, the coverage gate would pass having judged nothing, and a
    # check that cannot fail is worse than no check.
    if: always() && needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The commit is pushed with DEPLOY_KEY, the one actor the ruleset on main lets push
    # directly. It is a secret of the main-push environment, which only main may deploy
    # to (docs.yml says why). Any other ref runs with no environment, so no key, and
    # checkout falls back to the read-only token.
    environment: ${{ github.ref == 'refs/heads/main' && 'main-push' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Install pyyaml
        run: pip install --quiet pyyaml
      - name: Download every observation
        uses: actions/download-artifact@v4
        with:
          pattern: observed-*
          path: /tmp/observed
      - name: Merge every platform's observations
        # EXTRACTED TO A FILE. This was ~45 lines of Python in a heredoc, which
        # tools/check_workflows.py sees as a string and no test could reach -- and it is
        # the step that decides what the committed record says. Two bugs were sitting in
        # it, both invisible to every gate and both only observable on main: it erased the
        # `archived` list on every run, and it resurrected archived records from another
        # runner's upload. Both are asserted in test/test_matcher.py now.
        #
        # --reported-out carries what the heredoc used to write inline: the scenarios that
        # actually uploaded, which the coverage gate below reads to tell PENDING from
        # MISSING. A scenario that failed or exited 3 uploads nothing and is absent from
        # the list, so its identifiers stay pending rather than counting as absent.
        run: |
          python3 tools/merge_observations.py /tmp/observed test/scenarios \
            --reported-out /tmp/reported.txt

      # THE COVERAGE GATE, against THIS run's observations rather than the tree's.
      #
      # test/lint.sh asks the half of the question a static run can answer -- does some CI
      # scenario claim this identifier -- and defers the other half here, because only a
      # scenario that has just run can say whether the identifier actually appeared. Left
      # in lint, that question could only ever be asked of observations committed before
      # the branch existed, so every signature PR failed it however correct it was.
      #
      # NOT always(). If the matrix did not finish there is nothing to judge, and a second
      # red on a build that is already red for a real reason is noise that trains people to
      # skim. The `reported` list makes this safe rather than lenient: a scenario that
      # failed or skipped is not in it, so its identifiers stay pending instead of being
      # counted as missing.
      - name: Coverage against this run
        run: |
          python3 tools/agent_status.py --gate --pending-ok \
            --reported "$(cat /tmp/reported.txt)"

      - name: Regenerate the doc and commit if anything moved
        # MAIN ONLY, and this is the line the gate above used to be trapped behind. A pull
        # request must not be able to move its own recorded coverage; it must still be able
        # to be CHECKED. Those are different statements and are now in different steps.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ON TOP OF THE CURRENT MAIN, NOT THE COMMIT THIS RUN WAS FOR. This job checks out
          # the run's own commit, and main may have moved since: a parallel run's collect, or
          # this run's own first attempt when a failed job is re-run. Pushing from the old
          # base is rejected with "fetch first" -- self-healing, since the next run records
          # the same observations, but red, and a red run is what a releaser reads as a broken
          # suite. Run 37255856907: two macOS jobs were re-run after an upload timeout, both
          # passed, and this step went red for a reason nobody needed to act on.
          #
          # So the merge is redone on the latest main before every push, which is correct
          # rather than merely safe: tools/merge_observations.py merges by key and the newest
          # run wins, so the result on any base is the same files. Three attempts, because
          # the window between fetch and push is a few seconds and another collect can still
          # land inside it; the third failure is reported as the error it is.
          #
          # [skip ci], BECAUSE A DEPLOY-KEY PUSH STARTS WORKFLOWS and a GITHUB_TOKEN push
          # does not. tools/ci_scope.py maps test/scenarios/<s>/observed.json back to <s>,
          # so without it each commit would re-run its own scenarios and commit again.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            python3 tools/merge_observations.py /tmp/observed test/scenarios
            python3 tools/agent_status.py --write
            git add test/scenarios/*/observed.json docs/agents.md README.md
            if git diff --cached --quiet; then
              echo "Coverage unchanged against $(git rev-parse --short HEAD). Nothing to commit."
              exit 0
            fi
            git commit -q \
              -m "docs: record identifier coverage observed by the scenario run" \
              -m "Written by tools/agent_status.py --record from each scenario's own output. Triggered by ${{ github.sha }}." \
              -m "[skip ci]"
            if git push -q origin main; then
              python3 tools/agent_status.py | tail -5 >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push rejected on attempt $attempt of 3: another collect landed; catching up and merging again"
          done
          echo "::error::could not push the observations after 3 attempts. Re-run this job."
          exit 1
