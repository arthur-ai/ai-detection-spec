name: Scenarios

# Installs real software on a throwaway runner and asserts what the query finds.
# Not run per pull request: macOS runner minutes are expensive and these take
# several minutes each. A maintainer can trigger a run on a contribution.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scenario:
    name: ${{ matrix.scenario }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # THE OS IS AN AXIS, NOT PART OF A SCENARIO'S NAME. A scenario is a subject --
        # what software, installed how -- and the platform it ran on travels with the
        # OBSERVATION instead. Encoding it in directory names would mean one copy of every
        # scenario per OS, edited in lockstep whenever a signature moves.
        #
        # Adding a label here fans the whole suite across both, and observed.json records
        # which OS produced each identifier -- so a signature that appears on one macOS
        # version and not another becomes visible rather than averaged away. Kept at one
        # label until a second is confirmed available: an invented runner label fails the
        # entire matrix rather than the one job that needed it.
        # TWO LABELS, so the suite runs on two macOS versions and observed.json records
        # which one produced each identifier. That is the whole point of the axis: a
        # signature that appears on one version and not another becomes visible instead of
        # being averaged into a single number.
        #
        # macos-14 is added rather than assumed available. If GitHub has retired the label,
        # THAT job fails with "no runner matching labels" and macos-15 still reports -- which
        # is why fail-fast is off. Read the result before adding a third.
        os: [macos-15, macos-14]
        scenario:
          - 00-baseline
          - 10-desktop-apps
          - 11-perplexity-desktop
          - 20-cli-agents
          - 21-cli-agents-homebrew
          - 25-python-agents
          - 40-browser
          - 45-claude-extension
          - 50-autonomous
          - 55-openclaw-npm
          - 56-openclaw-retired-names
          - 60-persistence
    steps:
      - uses: actions/checkout@v4
      - name: Install osquery
        run: |
          curl -fsSL -o /tmp/osquery.pkg https://pkg.osquery.io/darwin/osquery-5.23.1.pkg
          sudo installer -pkg /tmp/osquery.pkg -target /
      # bin/classify reads the catalog, and assert.sh now runs it: since D20 the query
      # enumerates and "did we find OpenClaw" is answered by the classifier, not by a
      # row count.
      - name: Install pyyaml
        run: pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml

      # A SCENARIO CAN BE UNRUNNABLE HERE RATHER THAN BROKEN, and until now only the VM
      # harness knew that. test/run.sh has read requires.json since it was written -- CI
      # never did, so adding a second macOS turned two honest "cannot run on this version"
      # facts into two red jobs, which is how a suite teaches people to ignore it.
      - name: Can this scenario run on this runner?
        id: runnable
        run: |
          req="test/scenarios/${{ matrix.scenario }}/requires.json"
          need=0
          [ -f "$req" ] && need=$(python3 -c "import json;print(json.load(open('$req')).get('min_macos',0))")
          have=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$have" -lt "$need" ]; then
            echo "runnable=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: needs macOS >= $need, this runner is $have"
            python3 -c "import json;print('  '+json.load(open('$req')).get('why',''))"
            echo "### SKIPPED on macOS $have" >> "$GITHUB_STEP_SUMMARY"
            echo "Needs macOS $need or newer. This is a fact about the runner, not a defect." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "runnable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision
        if: steps.runnable.outputs.runnable == 'true'
        run: test/scenarios/${{ matrix.scenario }}/setup.sh
      - name: Query and assert
        if: steps.runnable.outputs.runnable == 'true'
        run: |
          sudo -n /usr/local/bin/osqueryi --json < dist/discovery-darwin.sql > /tmp/out.json
          test/assert.sh /tmp/out.json test/scenarios/${{ matrix.scenario }}/expected.json

      # These runners install the REAL software, so this job's output is real-install
      # evidence -- the same grade test/run.sh records from a VM. Recording it here keeps
      # docs/agents.md's per-identifier coverage current without anyone remembering to run
      # VMs locally and commit the result.
      #
      # Uploaded rather than committed: eleven matrix jobs pushing to the same branch would
      # race, and the loser's observation would be lost silently. The collect job below
      # merges them and commits once.
      - name: Record which identifiers this run matched
        if: steps.runnable.outputs.runnable == 'true'
        run: |
          python3 tools/agent_status.py --record /tmp/out.json \
            test/scenarios/${{ matrix.scenario }} \
            --os "$(sw_vers -productVersion)" --arch "$(uname -m)"
      - name: Upload the observation
        if: steps.runnable.outputs.runnable == 'true'
        uses: actions/upload-artifact@v4
        with:
          # THE OS IS IN THE NAME. Two jobs per scenario now, and upload-artifact@v4 fails
          # outright on a duplicate name -- so without this the second platform's upload
          # errors and its evidence is lost.
          name: observed-${{ matrix.scenario }}--${{ matrix.os }}
          path: test/scenarios/${{ matrix.scenario }}/observed.json
          if-no-files-found: error

      # Enumeration trades payload for not being wrong about the catalog, so the payload
      # is now a number worth watching per scenario rather than once on a developer Mac.
      #
      # always() AND runnable, not always() alone. always() includes SKIPPED, so on a runner
      # the scenario cannot use, this measured a /tmp/out.json that no step ever wrote and
      # turned an honest skip into a red job -- which is what the gate above exists to
      # prevent. The always() half still earns its place: when the assert FAILS the query did
      # run, and the payload of a failing run is the number worth having.
      - name: Measure the payload
        if: always() && steps.runnable.outputs.runnable == 'true'
        run: python3 tools/measure_payload.py /tmp/out.json
      - name: Keep the output
        if: always() && steps.runnable.outputs.runnable == 'true'
        uses: actions/upload-artifact@v4
        with:
          # THE OS IS IN THE NAME, as it is for the observation above. Two jobs per scenario
          # upload this one, and run 33476286840 shows both landing under the bare scenario
          # name -- two artifacts, one name, and no way to tell which macOS produced the
          # output you just downloaded. That is not a failure, it is worse: an ambiguity that
          # reads as a single answer.
          name: ${{ matrix.scenario }}--${{ matrix.os }}
          path: /tmp/out.json

  # One job after the matrix, so the commit happens once rather than eleven times.
  # --- LINUX ---------------------------------------------------------------------------
  #
  # A SECOND JOB RATHER THAN A THIRD LABEL IN THE MATRIX ABOVE. The OS is an axis, but it
  # is a SPARSE one: a scenario that installs Homebrew casks cannot run on Ubuntu and a
  # scenario that installs a .deb cannot run on a Mac, so a full cross-product would be
  # mostly jobs that exist to be skipped. Each scenario declares its platform in
  # expected.json and appears under the job that can run it -- and
  # tools/check_workflows.py asserts that pairing in both directions, so a Linux scenario
  # listed only here cannot silently stop being run, and one listed nowhere fails the build.
  #
  # NO VM LAYER. The macOS scenarios run directly on the hosted runner too -- Tart is only
  # the local path, test/run.sh -- so Linux needs nothing new: a hosted ubuntu-24.04 has
  # systemd as PID 1, which is what 76-linux-systemd needs and what a container cannot give.
  scenario-linux:
    name: ${{ matrix.scenario }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        scenario:
          - 70-linux-baseline
          - 71-linux-cli-agents
          - 72-linux-python-agents
          - 73-linux-deb
          - 74-linux-dpkg-removed
          - 75-linux-browser
          - 76-linux-systemd
          - 78-linux-vscode
    steps:
      - uses: actions/checkout@v4
      - name: Install osquery
        run: |
          # The deb, not the pkg. Both the deb and the rpm install osqueryi to
          # /usr/bin/osqueryi -- verified on Ubuntu 24.04 and Fedora 41 -- which is the
          # path bin/container-scan's osqueryi_path() now looks for.
          curl -fsSL -o /tmp/osquery.deb \
            https://pkg.osquery.io/deb/osquery_5.23.1-1.linux_amd64.deb
          sudo dpkg -i /tmp/osquery.deb
          osqueryi --version
      - name: Install pyyaml
        run: pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml

      # A scenario can be unrunnable here rather than broken, exactly as on macOS. The
      # Linux axis is `min_kernel` where it is used at all -- most of these skip on a
      # FACT ABOUT THE RUNNER instead, by exiting 3 from setup.sh, because the things that
      # stop them (no Chrome for arm64, no system dbus in a container) cannot be known
      # before the script runs.
      - name: Provision
        id: provision
        run: |
          set +e
          test/scenarios/${{ matrix.scenario }}/setup.sh
          rc=$?
          set -e
          # EXIT 3 IS SKIP, and it is the same contract test/run.sh has used since it was
          # written. A scenario that fails where nobody can act on it trains people to
          # ignore a red suite.
          if [ "$rc" = 3 ]; then
            echo "runnable=false" >> "$GITHUB_OUTPUT"
            echo "### SKIPPED: the scenario reported this runner cannot host it" \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          else
            echo "runnable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Query and assert
        if: steps.provision.outputs.runnable == 'true'
        run: |
          sudo -n /usr/bin/osqueryi --json < dist/discovery-linux.sql > /tmp/out.json
          test/assert.sh /tmp/out.json test/scenarios/${{ matrix.scenario }}/expected.json
      - name: Record which identifiers this run matched
        if: steps.provision.outputs.runnable == 'true'
        run: |
          # --platform, alongside --os and --arch. `os` alone holds "24.04", which names a
          # distro release and not a platform family, so coverage could not be counted per
          # platform without it.
          python3 tools/agent_status.py --record /tmp/out.json \
            test/scenarios/${{ matrix.scenario }} \
            --platform linux --os "$(. /etc/os-release && echo "$VERSION_ID")" \
            --arch "$(uname -m)"
      - name: Upload the observation
        if: steps.provision.outputs.runnable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: observed-${{ matrix.scenario }}--${{ matrix.os }}
          path: test/scenarios/${{ matrix.scenario }}/observed.json
          if-no-files-found: error

  # The RPM family, in a container on the same runner, because GitHub offers no
  # RPM-distro runner. It is a separate job rather than a matrix entry because
  # `container:` applies to the whole job.
  #
  # WHAT IT REALLY GUARDS is that ONE dist/discovery-linux.sql serves both families: the
  # artifact names deb_packages and rpm_packages, and the absent one has to return no rows
  # rather than error the statement. A genuinely missing table does the opposite --
  # snap_packages returns [] and exits 1 -- so this is the run that keeps the difference
  # honest.
  scenario-linux-rpm:
    name: ${{ matrix.scenario }} on fedora
    runs-on: ubuntu-24.04
    container: fedora:41
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - 77-linux-rpm
    steps:
      - name: Install prerequisites
        run: dnf -q -y install git curl tar python3 python3-pip findutils
      - uses: actions/checkout@v4
      - name: Install osquery
        run: |
          curl -fsSL -o /tmp/osquery.rpm \
            https://pkg.osquery.io/rpm/osquery-5.23.1-1.linux.x86_64.rpm
          rpm -i --nodeps /tmp/osquery.rpm
          osqueryi --version
      - name: Install pyyaml
        run: pip3 install --quiet pyyaml || dnf -q -y install python3-pyyaml
      - name: Provision
        id: provision
        run: |
          set +e
          test/scenarios/${{ matrix.scenario }}/setup.sh
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "runnable=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" != 0 ]; then exit "$rc"
          else echo "runnable=true" >> "$GITHUB_OUTPUT"; fi
      - name: Query and assert
        if: steps.provision.outputs.runnable == 'true'
        run: |
          # No sudo in the container -- it runs as root, which is also why
          # test/lib/guest-linux.sh's sudo_maybe exists rather than assuming one shape.
          /usr/bin/osqueryi --json < dist/discovery-linux.sql > /tmp/out.json
          test/assert.sh /tmp/out.json test/scenarios/${{ matrix.scenario }}/expected.json
      - name: Record which identifiers this run matched
        if: steps.provision.outputs.runnable == 'true'
        run: |
          python3 tools/agent_status.py --record /tmp/out.json \
            test/scenarios/${{ matrix.scenario }} \
            --platform linux --os "$(. /etc/os-release && echo "$VERSION_ID")" \
            --arch "$(uname -m)"
      - name: Upload the observation
        if: steps.provision.outputs.runnable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: observed-${{ matrix.scenario }}--fedora
          path: test/scenarios/${{ matrix.scenario }}/observed.json
          if-no-files-found: error

  collect:
    name: Commit observations
    needs: [scenario, scenario-linux, scenario-linux-rpm]
    # always() so a green scenario's observation still lands when a DIFFERENT scenario
    # failed. Each observation is independent evidence, and discarding all of them because
    # one scenario broke would throw away the runs that worked.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: pip install --quiet pyyaml
      - name: Download every observation
        uses: actions/download-artifact@v4
        with:
          pattern: observed-*
          path: /tmp/observed
      - name: Merge every platform's observations
        run: |
          # MERGE, NOT COPY. There is one artifact per (scenario, OS) now, and both describe
          # the same observed.json. Copying meant whichever landed last decided what the
          # scenario had ever proved, and the other platform's evidence vanished -- which is
          # the exact thing the OS axis exists to make visible.
          #
          # Records carry their own os and arch, so the union is keyed on
          # (agent, route, value, os, arch) and needs no cleverness.
          python3 - <<'PYEOF'
          import json, pathlib, collections
          merged = collections.defaultdict(dict)
          for d in sorted(pathlib.Path("/tmp/observed").glob("observed-*--*")):
              f = d / "observed.json"
              if not f.is_file():
                  continue
              doc = json.loads(f.read_text())
              scen = doc.get("scenario") or d.name.split("--")[0].removeprefix("observed-")
              for r in doc.get("identifiers", []):
                  key = (r["agent"], r["route"], r["value"], r.get("os"), r.get("arch"))
                  merged[scen][key] = r
          for scen, recs in sorted(merged.items()):
              out = pathlib.Path("test/scenarios") / scen / "observed.json"
              if not out.parent.is_dir():
                  continue
              rows = sorted(recs.values(),
                            key=lambda r: (r["agent"], r["route"], r["value"],
                                           r.get("os") or "", r.get("arch") or ""))
              out.write_text(json.dumps({"scenario": scen, "identifiers": rows},
                                        indent=2) + "\n")
              plats = sorted({r.get("os") for r in rows if r.get("os")})
              print(f"  {scen}: {len(rows)} records across {plats or ['(no platform)']}")
          PYEOF
      - name: Regenerate the doc and commit if anything moved
        run: |
          python3 tools/agent_status.py --write
          git add test/scenarios/*/observed.json docs/agents.md README.md
          if git diff --cached --quiet; then
            echo "Coverage unchanged. Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "docs: record identifier coverage observed by the scenario run" \
            -m "Written by tools/agent_status.py --record from each scenario's own output. Triggered by ${{ github.sha }}."
          git push
          python3 tools/agent_status.py | tail -5 >> "$GITHUB_STEP_SUMMARY"
