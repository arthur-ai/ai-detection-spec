name: Release

# Fires when a draft release is published. The version and the notes are a human's
# judgement and happen before this point; this workflow's only job is to guarantee that
# what hangs off the release page was built from the tagged commit, rather than uploaded
# from whatever happened to be in somebody's working copy.
on:
  release:
    types: [published]

permissions:
  contents: write # replacing the release's assets needs write

jobs:
  artifacts:
    name: Build and attach dist/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0 # the ancestry check below needs main's history

      # A tag on a side branch would ship a query that never went through review or the
      # macOS gates, and nothing on the release page would hint at it. Publishing is one
      # click from a draft, so the wrong target is a plausible mistake rather than a
      # theoretical one.
      - name: Confirm the tag is on main
        run: |
          git fetch --no-tags origin main
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${{ github.event.release.tag_name }} ($sha) is not an ancestor of main"
            exit 1
          fi
          echo "$sha is on main"

      # Same two the lint job installs: the scenario scripts are zsh, and the catalog
      # validator and workflow parser need pyyaml.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install pyyaml
        run: pip install --quiet pyyaml

      # The static gates, re-run against the tagged commit: the six-column contract, the
      # catalog, and that no agent identifier has crept back into the SQL. The macOS
      # gates -- cost bands and a real osqueryi run -- already ran on the push to main
      # that this tag points at, so repeating them here would buy nothing and spend
      # macOS runner minutes.
      - name: Static checks
        run: test/lint.sh

      # dist/ is committed AND attached, so the two can disagree. test/lint.sh already
      # asserts they don't, via build.py --check. The rebuild is what actually produces
      # the file we upload, and the diff keeps that guarantee sitting next to the upload
      # instead of three steps away.
      - name: Rebuild dist/ from the tagged queries
        run: |
          python3 tools/build.py
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ does not match queries/ at this tag"
            exit 1
          fi

      # BUILT FROM THE TAGGED COMMIT, like dist/ above, and labelled with the tag so a
      # bundle found on a machine months later says which release it came from. Not
      # committed: it is derived, it changes with every query edit, and 37KB of base64 in
      # the tree is a diff nobody can review.
      - name: Build the one-file bundles
        run: |
          tag="${{ github.event.release.tag_name }}"
          python3 tools/bundle.py --platform darwin --label "$tag"
          python3 tools/bundle.py --platform linux  --label "$tag"

      # --clobber replaces whatever was attached to the draft by hand. A consumer pins a
      # tag and downloads these files; they are the deliverable, not a convenience.
      #
      # The three dist/ files are rebuilt from queries/ at the tagged commit above, so they
      # are derived from the tagged source by construction. bin/* are NOT generated -- they
      # come from the checkout, and the tag-is-on-main check is the whole of their
      # provenance.
      #
      # bin/container-scan resolves dist/discovery-deep.sql relative to its own parent
      # directory, and bin/discover sources bin/container-scan. Downloaded loose into one
      # folder they will not find each other: the layout is bin/, dist/ and catalog/ side
      # by side, as in the repo. Say so in the release notes.
      #
      # THE BUNDLES ARE THAT LAYOUT, INSIDE ONE FILE, for a consumer whose platform can
      # host a script and cannot place files on disk. Same artifacts, same behaviour, every
      # argument passed through -- what they remove is the chance to lay them out wrongly.
      #
      # THE COMPOSED ARTIFACT IS PER PLATFORM, and bin/discover picks by `uname -s`. There
      # is no unqualified discovery.sql any more: it named one platform while claiming
      # none, and fed to the wrong osqueryi it returns "[\n\n]" -- valid, empty,
      # plausible JSON. A consumer pinning the old name gets a 404, which is the failure
      # we want rather than a silent half-answer.
      #
      # THE CATALOG SHIPS NOW, and it did not before -- bin/classify's default
      # --catalog is catalog/agents.yaml relative to its own parent, so a downloaded
      # classifier had nothing to match against unless the consumer also cloned the repo.
      # catalog/routes.yaml is required alongside it: it is the route registry the matcher
      # derives its whole vocabulary from.
      #
      # Deployment glue for a particular MDM is deliberately not here, and the bundles are
      # not an exception to that: they carry no output path, no wire format and no size
      # budget, because none of those is a fact about osquery. A consumer who needs them
      # supplies them through `tools/bundle.py --driver`, on their side of the seam. This
      # repo ships osquery materials.
      - name: Attach the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/discovery-darwin.sql dist/discovery-linux.sql \
            dist/discovery-deep.sql dist/ai-discovery.conf \
            bin/discover bin/container-scan bin/classify \
            catalog/agents.yaml catalog/routes.yaml \
            artifacts/ai-discovery-darwin.sh artifacts/ai-discovery-linux.sh --clobber
