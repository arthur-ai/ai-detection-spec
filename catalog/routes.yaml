# The route registry: every route the catalog uses, declared once.
#
# bin/classify, tools/validate_catalog.py, tools/agent_status.py and test/lint.sh derive
# their route lists from this file, and osquery/tools/build.py checks its bindings, so
# adding a route is one edit here. Five hand-kept lists used to have to agree, and `ext` was
# missing from one: every browser-extension row was dropped, invisible even under
# --show-unmatched.
#
# This is the authoring form of a catalog document's `routes` (SPEC.md 4.3), and
# tools/export.py writes it into one. `osquery:` on a route is the document's
# `bindings.osquery` (SPEC.md 8.1); a second binding would be a second key beside it.
#
# EVERY FIELD IS READ. A field no code checks can disagree with reality without anything
# failing, as agents.yaml's unread `version: 1` once did.
#
# FIELDS
#   platform      darwin | linux | windows | posix (darwin and linux) | all (every platform)
#   kind          the evidence row kind that carries the route (SPEC.md 5.1)
#   match         how a value is compared with a row; SPEC.md 6.4 defines each mode
#   osquery       {table, min_osquery}: the osquery table the evidence comes from, and the
#                 lowest version that provides it. osquery/tools/build.py fails when no
#                 query on a platform the route covers declares both
#   value_pattern optional. A regex every value on the route must match in full
#   retired       optional. The route identifies nothing, but its kind is still collected
#                 and stays registered (SPEC.md 6.1) -- see `ports`
#   live          optional. A row of this route says the agent is running (SPEC.md 6.6)
#   values_from   optional. Match another route's values instead of its own (SPEC.md 6.3).
#                 tools/agent_status.py ignores it, so an identifier reachable two ways is
#                 counted once
#   purl          optional. The package-url type of the route's values, where a value alone
#                 is the coordinate; tools/export.py reads it. Absent on purpose elsewhere:
#                 purl's `brew` cannot tell a cask from a formula, `deb` and `rpm` need the
#                 distribution as a namespace, and JetBrains plugins have no type. A wrong
#                 coordinate lands in someone else's SBOM pipeline, where nobody here sees it.

# A platform outside this list is a typo: `macos` once built clean and gave a pack query
# osqueryd never scheduled.
platforms: [darwin, linux, windows]

# osqueryd's own words for a set of platforms, so a query's `-- platform:` and a route's
# `platform:` share one vocabulary. A NAME HERE MUST BE ONE osqueryd SCHEDULES:
# osquery/tools/build.py writes a query's word into the pack verbatim. A route is `all` only
# once a Windows query feeds it; build.py fails a route claiming a platform nothing feeds.
platform_groups:
  posix: [darwin, linux]
  all: [darwin, linux, windows]

routes:

  # --- macOS -------------------------------------------------------------------------
  bundle_ids:
    platform: darwin
    kind: app
    match: exact
    osquery: {table: apps, min_osquery: 5.10.0}
    # Reverse-DNS, and case-SENSITIVE by necessity: com.kagi.kagimacOS is a real shipped
    # identifier, so a lowercase-only pattern would reject a fact. Verified against all
    # ten bundle_ids in the catalog before being written down.
    value_pattern: '^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+){2,}$'
  homebrew:
    platform: darwin
    kind: brew
    match: exact
    osquery: {table: homebrew_packages, min_osquery: 5.10.0}
  launchd_prefixes:
    platform: darwin
    kind: daemon
    match: prefix
    osquery: {table: launchd, min_osquery: 5.10.0}
  running_apps:
    # LIVENESS, built as that and named as that, which is what the catalog said it would
    # take when `ports` was retired. A `proc` row says the agent is RUNNING. The value is the
    # bundle id read from the running bundle's own Info.plist, so this reads `bundle_ids`
    # and a running app needs no second signature.
    platform: darwin
    kind: proc
    live: true
    match: exact
    osquery: {table: processes, min_osquery: 5.10.0}
    values_from: bundle_ids

  # --- portable ----------------------------------------------------------------------
  npm:
    platform: all
    kind: npm
    match: exact
    purl: npm
    osquery: {table: npm_packages, min_osquery: 5.10.0}
  running_npm:
    # A process running out of a package, or a node, bun or deno process whose script sits
    # in one. osquery/queries/running.sql extracts the package name and never ships the cmdline.
    platform: all
    kind: proc
    live: true
    match: exact
    osquery: {table: processes, min_osquery: 5.10.0}
    values_from: npm
  pypi:
    platform: all
    kind: file
    match: tool-dir
    purl: pypi
    osquery: {table: file, min_osquery: 5.10.0}
  extension_ids:
    # Chromium extension ids are derived from the developer's public key, so they are
    # identical on every OS and across every browser_type osquery enumerates.
    platform: all
    kind: ext
    match: exact
    # Chrome Web Store ids. A store that re-signs, such as Edge Add-ons, issues another id,
    # which is not a chrome-extension purl; test/test_export.py holds each value to a
    # scenario that downloads it from the Web Store's update endpoint.
    purl: chrome-extension
    osquery: {table: chrome_extensions, min_osquery: 5.10.0}
    # 32 characters from a-p: a base16 encoding of the first half of a SHA-256 over the
    # key, remapped onto letters. A hex-looking id, one with a digit, or one of the
    # wrong length was transcribed rather than read off an install.
    value_pattern: '^[a-p]{32}$'
  native_messaging_hosts:
    # The VALUE is a portable filename. The DIRECTORY is per-OS and lives in the queries:
    # macOS uses ~/Library/Application Support/<browser>/NativeMessagingHosts/, Linux
    # uses ~/.config/<browser>/NativeMessagingHosts/ for the user scope and the
    # lower-case /etc/opt/chrome/native-messaging-hosts/ for the system scope. Both
    # casings were read off a real Chrome install; osquery's LIKE is case-sensitive.
    # Windows REGISTERS a manifest rather than placing it, under a NativeMessagingHosts\<host>
    # key, and osquery/queries/native-messaging-windows.sql follows the key to the file:
    # Claude Desktop's registered manifest is named com.anthropic.claude_browser_extension.json
    # there too (survey run 40393754308).
    platform: all
    kind: nmh
    match: exact
    osquery: {table: file, min_osquery: 5.10.0}
  vscode_extensions:
    # NEW, and it retires a blind spot rather than adding one. docs/blind-spots.yaml said
    # "osquery has no table for them at all" -- true at 5.10.0, false from 5.11.0.
    #
    # THE VALUE IS THE `name` COLUMN ALONE, and reading that off a real install is what
    # stopped a wrong identifier shipping. `name` already holds the FULL marketplace id
    # -- `saoudrizwan.claude-dev` -- and `publisher_id`, which reads like the publisher
    # slug, is a GUID: 6f42e67d-d7ea-4a53-8704-2ae8bf2d86f3 for Cline. The obvious
    # expression `publisher_id || '.' || name` therefore yields
    # `6f42e67d-....saoudrizwan.claude-dev`, which matches nothing and looks deliberate.
    # `publisher` is a display name ("Cline"), not an id either. Verified 2026-09-04
    # against osquery 5.23.1 with Cline 4.1.17 and Continue 2.0.0 installed by
    # `code --install-extension`.
    #
    # min_osquery is 5.15.0, ABOVE the 5.10.0 floor every other route declares, which is
    # the whole reason the bound is per-route and per-query rather than repo-wide. The
    # table arrived in 5.11.0, but the queries also read `vscode_edition`, which tells VS
    # Code from Cursor, Windsurf and VSCodium, and it arrived in 5.15.0. A column the table
    # lacks fails the whole statement, so a build between the two reads no extension at all
    # (osquery/queries/vscode.sql).
    platform: all
    kind: vscodeext
    match: exact
    purl: vscode-extension
    osquery: {table: vscode_extensions, min_osquery: 5.15.0}
    value_pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*\.[A-Za-z0-9][A-Za-z0-9._-]*$'
  jetbrains_plugins:
    # THE VALUE IS THE PLUGIN DIRECTORY NAME, the last component of the row's `path`. The
    # plugin's own id (`bot.cline`) lives in META-INF/plugin.xml and the table does not
    # expose it; `name` is a display name. The directory is the root of the zip the
    # Marketplace serves, which the IDE unpacks as-is, so the vendor chose it.
    #
    # WHERE THE TABLE LOOKS, read off osquery's jetbrains_plugins.h at 5.23.1: Linux
    # `~/.local/share/JetBrains/<Product>%` with NO plugins/ suffix, macOS
    # `~/Library/Application Support/JetBrains/<Product>%/plugins`.
    #
    # min_osquery 5.18.0: the spec is absent at 5.17.0 and present at 5.18.0. Same
    # consequence as vscode_extensions: its own pack entry and its own branch.
    platform: posix
    kind: jbplugin
    match: exact
    osquery: {table: jetbrains_plugins, min_osquery: 5.18.0}
    value_pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
  images:
    platform: posix
    kind: image
    match: exact-normalised
    osquery: {table: docker_images, min_osquery: 5.10.0}
  container_images:
    # THE SAME VALUES AS `images`, REACHED THROUGH A RUNNING CONTAINER. Catalogued under
    # `images:` on the agent -- an agent does not need a second list -- and separate here
    # only because the ROW KIND differs, which is what the registry keys on.
    #
    # WHY IT IS WORTH A SECOND ROUTE. docker_images answers "is this pulled", which is a
    # fact about the disk. This answers "is it RUNNING", which no other route in this repo
    # can answer about anything: every other one reports presence. A pulled-and-forgotten
    # image and a live agent are different findings and were previously the same row.
    #
    # Measured 2026-09-11, Docker 28.4.0 / osquery 5.23.1: docker_containers lists RUNNING
    # containers only -- two exited containers on the probe host produced ZERO rows. So
    # this route never supersedes `images`, it corroborates it, and an agent that is
    # installed but stopped is still seen by `images` alone.
    #
    # `image` on this table carries the full tag ("paulgauthier/aider:latest"), verified on
    # that same host, so image_repo() normalises it exactly as it does a docker_images tag
    # and the two routes cannot disagree about what a repository name is.
    platform: posix
    kind: container
    live: true
    match: exact-normalised
    osquery: {table: docker_containers, min_osquery: 5.10.0}
    # Reads `images:` off each agent rather than a list of its own. See bin/classify's
    # Registry for why duplication was rejected, and note the consequence for coverage:
    # an aliased route contributes no catalog key, so tools/agent_status.py counts the
    # identifier ONCE, under `images`. One image, reached two ways, is one identifier.
    values_from: images
  image_labels:
    # THE ONE CONTAINER IDENTIFIER A RETAGGER DOES NOT CONTROL. An image TAG is chosen by
    # whoever ran `docker tag`, which makes `images` the only route here whose identifier
    # is not vendor-controlled. An OCI label is written by the vendor in their own
    # Dockerfile and travels in the image manifest, so it is the container equivalent of a
    # bundle id: `docker tag alpine ghcr.io/block/goose` renames a local reference and adds
    # no labels to anything.
    #
    # WHY IT MATCHES `org.opencontainers.image.source` AND NOTHING ELSE. Measured across
    # eighteen real images on 2026-09-11: every image carrying `source` carried a correct
    # vendor URL, while `title`, `vendor` and `ref.name` are INHERITED FROM THE BASE IMAGE
    # and routinely wrong. litellm's own image reports title=wolfi-base, vendor=Chainguard
    # while its source is correctly https://github.com/BerriAI/litellm; sweagent/swe-agent
    # reports ref.name=ubuntu, version=22.04 and nothing else. A route keyed on `title`
    # would offer "ubuntu" as an agent's identity, which is the confident wrong answer this
    # repo exists to avoid. `version` is unreliable for the same reason -- goose reports
    # "main", OpenHands "main-amd64" -- and is not emitted.
    #
    # WHAT CARRIES A LABEL IS A FACT ABOUT PUBLISHING, NOT ABOUT BEING AN AGENT, and that
    # was worth learning the hard way. A first pass over stale images concluded agents do
    # not set labels at all: paulgauthier/aider has NONE, sweagent/swe-agent only inherited
    # Ubuntu ones, significantgravitas/auto-gpt only GIT_REVISION. Every one of those
    # images was between seven months and two and a half years old. The CURRENTLY published
    # agent images set them properly -- ghcr.io/openhands/openhands (2026-07-21) and
    # ghcr.io/block/goose (2026-04-06) both carry a correct `source` -- because a modern
    # release pipeline injects them. So this route covers the agents a fleet is most likely
    # to be running NOW, and misses the abandoned ones, which is the opposite of the usual
    # staleness problem and is why `images` stays beside it rather than being replaced.
    platform: posix
    kind: ilabel
    match: exact
    osquery: {table: docker_image_labels, min_osquery: 5.10.0}
    # A URL, because that is what `source` holds. Anchored at both ends so a bare project
    # name cannot be written here by someone reaching for `title` instead.
    value_pattern: '^https?://[A-Za-z0-9.-]+/[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$'
  state_dirs:
    platform: all
    kind: file
    match: home-dir
    osquery: {table: file, min_osquery: 5.10.0}
  binaries:
    platform: all
    kind: file
    match: home-prefix
    osquery: {table: file, min_osquery: 5.10.0}
  process_paths:
    # A `~/`-rooted path a RUNNING agent's executable sits under, or is. Its own values, so
    # every one must be produced by a CI scenario. A value ends in `/` where a version
    # directory follows. One that repeats a `binaries` value is not a duplicate: that route
    # reads `file` rows and this one `proc` rows, as on Windows, where Claude Code runs from
    # the ~/.local/bin/claude.exe its installer writes.
    platform: all
    kind: proc
    live: true
    match: home-prefix
    osquery: {table: processes, min_osquery: 5.10.0}
  model_stores:
    # Carries no values today: it went with the model runners, which are not agents.
    # Kept registered because its kind is still collected -- see `ports` below for what
    # unregistering a live kind costs.
    platform: posix
    kind: file
    match: home-prefix
    osquery: {table: file, min_osquery: 5.10.0}
  ports:
    # RETIRED AS A SIGNATURE, AND IT MUST STAY REGISTERED ANYWAY. A port only ever
    # matched when the process holding it already named the agent, so it added no
    # identifying power -- a second opinion from the same witness. catalog/agents.yaml's
    # header has the measurement.
    #
    # But osquery/queries/ports.sql still emits kind='port' rows as raw evidence, and a kind
    # absent from the registry is DROPPED by bin/classify, not unmatched. Deleting this
    # entry would reproduce the `ext` bug exactly: rows collected, rows correct, rows
    # invisible even under --show-unmatched. `retired` keeps the kind registered and the
    # route unable to claim anything.
    platform: posix
    kind: port
    match: exact
    osquery: {table: listening_ports, min_osquery: 5.10.0}
    retired: true

  # --- Linux -------------------------------------------------------------------------
  deb_packages:
    # THE STATUS FILTER IS PART OF THE QUERY, NOT THIS ROUTE, and it is not optional.
    # Verified in a container against a real `apt-get remove` without purge: dpkg keeps
    # the row as `deinstall ok config-files` WITH THE VERSION STILL ATTACHED, and
    # osquery reports it. Unfiltered, an uninstalled agent reads as an installed one.
    # osquery/queries/packages-linux.sql carries the filter and the measurement.
    platform: linux
    kind: deb
    match: exact
    osquery: {table: deb_packages, min_osquery: 5.10.0}
  rpm_packages:
    # Verified to coexist with deb_packages in ONE composed artifact: on Debian this
    # returns 0 rows and exit 0 with no stderr, and deb_packages does the same on
    # Fedora. That is what lets a single osquery/dist/discovery-linux.sql serve both families
    # instead of splitting the artifact per package manager.
    platform: linux
    kind: rpm
    match: exact
    osquery: {table: rpm_packages, min_osquery: 5.10.0}
  desktop_ids:
    # Linux's nearest analogue to a bundle id, and THE ONLY ROUTE THAT CAN SEE AN
    # AppImage OR TARBALL INSTALL: neither leaves a package record, and both commonly
    # write a .desktop entry. Cursor's primary Linux download is an AppImage, so without
    # this route its most common install shape is invisible.
    #
    # A real google-chrome-stable install writes TWO entries -- com.google.Chrome.desktop
    # and google-chrome.desktop -- so values on this route come in both a reverse-DNS
    # and a bare shape, and the pattern below has to admit both.
    platform: linux
    kind: desktop
    match: exact
    osquery: {table: file, min_osquery: 5.10.0}
    value_pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*\.desktop$'
  systemd_prefixes:
    # REGISTERED, AND CARRYING NO VALUES. That is the whole state of this route, and it is
    # deliberate rather than unfinished.
    #
    # It was written expecting `systemd_prefixes: [ai.openclaw.]` to mirror the macOS
    # `launchd_prefixes` entry. That would have been a GUESS: the launchd labels were read
    # off a live OpenClaw install, and no equivalent has been read off a Linux one. The
    # test that caught it is in test/test_matcher.py -- a unit named
    # ai.openclaw.gateway.service resolved to nothing, because nothing claims it.
    #
    # SO WHY KEEP THE ROUTE AT ALL. Because osquery/queries/runtime-linux.sql emits kind='unit'
    # rows, and a kind absent from this registry is DROPPED by bin/classify rather than
    # reported unmatched -- invisible even under --show-unmatched. That is the `ext` bug,
    # and it is why `ports` is still here too. Registering the kind is what keeps a
    # systemd unit visible as EVIDENCE while nothing pretends it is a signature.
    #
    # IT IS NOT RETIRED, and the difference from `ports` matters. A port cannot identify
    # anything in principle -- it only ever matched once something else had already named
    # the agent. A unit name can: a vendor controls it the way it controls a launchd
    # label. This route is unproven, not disproven, and the day a real install produces a
    # vendor-named unit the value goes here and 76-linux-systemd's assertion changes with
    # it. Until then docs/blind-spots.yaml carries the gap.
    #
    # systemd_units FAILS SOFT, which is why osquery/queries/runtime-linux.sql pairs it with a
    # kind=scan marker: with no reachable system bus it logs to stderr, contributes ZERO
    # rows, and the statement still exits 0 and returns every other row. Measured in a
    # container: 0 units, exit 0, 131 other rows. Without the marker a chroot, a
    # container or a locked-down host reports "no agent units" in the exact shape a clean
    # host does.
    platform: linux
    kind: unit
    match: prefix
    osquery: {table: systemd_units, min_osquery: 5.10.0}

  # --- Windows -----------------------------------------------------------------------
  msix_families:
    # A Store or sideloaded MSIX app's PACKAGE FAMILY NAME, `<Name>_<PublisherHash>`: the
    # version and architecture are not in it, so it is the bundle id's counterpart. Claude
    # Desktop ships as one, and `programs` reports it as `Claude_pzs8sxrjxfjjc` (survey run
    # 40393754308). min_osquery 5.17.0, where `programs` learned MSIX (osquery/osquery#8585).
    platform: windows
    kind: msix
    match: exact
    osquery: {table: programs, min_osquery: 5.17.0}
    # The publisher hash is 13 characters of base32; every one of the 48 family names on a
    # stock windows-2025 runner has that shape.
    value_pattern: '^[A-Za-z0-9][A-Za-z0-9.-]*_[a-z0-9]{13}$'
  uninstall_keys:
    # THE UNINSTALL KEY'S NAME, which the installer chooses and keeps across versions: Inno
    # Setup writes `<AppId>_is1`, Squirrel the app name. `programs` reads the same keys and
    # hides the name, and its `identifying_number` is an MSI ProductCode, which changes with a
    # major upgrade. The DisplayName ships in `extra`, for a reader, and is never compared:
    # Cursor's reads "Cursor (User)", and Windsurf's "Devin (User)".
    #
    # A per-user install is under HKEY_USERS, which holds signed-in users' hives only, so it
    # is read while its user is signed in (docs/blind-spots.yaml).
    platform: windows
    kind: uninstall
    match: exact
    osquery: {table: registry, min_osquery: 5.10.0}
