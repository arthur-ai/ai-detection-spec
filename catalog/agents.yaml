# Detection catalog for AI agents on macOS.
#
# One entry per tool, carrying EVERY route it ships through. A single agent commonly
# arrives as a Homebrew cask, an npm global and a curl installer that wraps npm, and
# each lands somewhere different. A fleet that standardised on one route is invisible
# to a signature written for another.
#
# Identifiers are FACTS read off real installs, never taken from vendor documentation.
# We shipped `bot.molt.mac` for OpenClaw once, straight from the vendor's own Homebrew
# metadata, and it matched nothing on any Mac. See CONTRIBUTING.md.
#
# `images` is a container image REPOSITORY, matched exactly against a normalised
# docker_images tag: no `docker.io/` prefix and no `library/` on Docker Hub, the registry
# host present everywhere else. bin/classify's image_repo() does the normalising and
# records the four rules it was read off. Two things about this route are worth knowing
# before adding to it:
#
#   * An image name is CHOSEN BY WHOEVER TAGGED IT. `docker tag alpine ollama/ollama`
#     produces a finding, and nothing can tell it from the real image. Every other route
#     here names something a vendor controls; this one does not.
#   * A local build is shaped exactly like a Docker Hub library image, so a one-segment
#     value such as `ollama` would claim anybody's `ollama:latest` build. Prefer the
#     two-segment published name.
#
# Every `images` value here was read off a real docker_images row, and the comment beside
# each one records the row. Two of them needed a detour: Docker Hub pulls are blocked
# daemon-side on the machine this was verified on, so the layers were fetched from the
# registry directly and side-loaded as an OCI archive. CONTRIBUTING.md has the method. A
# registry manifest alone would have been weaker -- authoritative about the NAME, silent
# about how a row renders it -- and the detour was cheaper than that compromise.
#
# `classification` describes DEPLOYMENT SHAPE, not risk or quality. Whether an agent is
# acceptable is the reader's judgement about their fleet, not ours about a vendor.
#
# Old identifiers are kept as aliases rather than removed: machines that installed an
# earlier version still carry them.

# Four kinds of query literal are deliberately NOT catalog entries, because they are
# structural rather than tool-specific:
#
#   ~/.local/pipx/venvs/%/          enumerate every pipx tool, not a named one
#   ~/.local/share/uv/tools/%/      likewise for uv
#   ~/.npm/_npx/%/node_modules/X/   the npx cache path is derived from the npm name,
#                                   so `npm: [openclaw]` already implies it
#
# A matcher expands those; the catalog does not repeat them.

version: 1

# THIS CATALOG DETECTS AGENTS. Two entries were REMOVED for failing that test, and the
# reason is recorded here because the temptation to re-add them is obvious -- both show up
# in an AI inventory and both were easy to detect:
#
#   mcp-sdk   the Model Context Protocol SDK is a LIBRARY an agent is built with. Agent
#             tooling, not an agent. Detecting it says a developer imported a protocol.
#   litellm   an LLM gateway an agent calls THROUGH. Detecting it says traffic may be
#             proxied, not that anything is acting on a user's behalf.
#
# Neither acts on anyone's behalf, and counting them among "agents found on this Mac"
# overstates the finding -- the kind of confident overstatement this repo exists to avoid.
# Their rows are kept in the FIXTURES as negative controls: test/test_matcher.py asserts
# they arrive and are declined, which is the only way to tell "correctly not an agent" from
# "route quietly broken".
#
#   ollama, lm-studio, jan, llama-cpp
#             MODEL RUNNERS. They serve language models; an agent is what drives one.
#             Removed when the scope was tightened to agents only. They are the strongest
#             candidates to come back if that scope ever widens, and the `model` query
#             branch went with them -- nothing consumed its rows.
#   docker    Docker Desktop is INSTRUMENTATION, not a finding. What we detect inside a
#             container is the agent IMAGE -- ollama/ollama, ghcr.io/ggml-org/llama.cpp,
#             paulgauthier/aider -- and the runtime is how we look, not what we are looking
#             for. Whether Docker is present is already answered, and answered better, by
#             the kind=scan marker row: `ok`, `absent`, `unhealthy:<code>`, `timeout:<n>`
#             distinguish "no Docker" from "Docker wedged", which a bundle id cannot.
#
classifications:
  # --- acts on the user's behalf ---
  - Coding agent        # operates on a codebase, usually with shell access
  - Personal agent      # general-purpose, often bridged to messaging
  - AI browser          # a browser whose AI features are the product
  - Browser agent       # an extension that acts inside the browser on the user's behalf
  - Desktop assistant   # chat client. Kept on THIS side of the line deliberately: the old
                        # definition read "no autonomous execution", which stopped being
                        # true when these clients gained MCP and began running tools
                        # locally. Contested rather than settled, and overstating an agent
                        # is the safer error for an inventory than missing one
  # --- does not act on anyone's behalf; listed in not_agents below ---


agents:
  - id: claude-desktop
    name: Claude Desktop
    classification: Desktop assistant
    bundle_ids: [com.anthropic.claudefordesktop]
    homebrew: [claude]
    native_messaging_hosts: [com.anthropic.claude_browser_extension.json]

  # Its own entry rather than a route on claude-desktop, because it installs
  # independently: no app bundle, no package manager, and it follows a Google account
  # across machines. claude-desktop's native_messaging_hosts entry above is the DESKTOP
  # side of the bridge this extension talks to -- related, separately installable, and a
  # fleet can have either without the other.
  #
  # The id is a fact read off a real install, per the rule at the top of this file:
  # collected by this repo's own browser query on a reference Mac, appearing three times
  # -- v1.0.90 and v1.0.85 in one Chrome profile, v1.0.85 in another. A Chrome extension
  # id is derived from the developer's public key, so it is stable across versions and
  # across the profiles that carry it, which is what makes it worth matching on.
  #
  # Two further ids circulate for Anthropic-related extensions and are DELIBERATELY ABSENT:
  # neither id was confirmed, so neither is a fact. Note this is a claim about the IDS, not
  # about testability -- 45-claude-extension verifies an id by fetching the Web Store's
  # signed CRX and deriving the id from its manifest key, so a confirmed id could be
  # verified in minutes. See docs/signature-lifecycle.md: a catalog may carry a guess, but
  # it may not hide one.
  - id: claude-in-chrome
    name: Claude in Chrome
    classification: Browser agent
    extension_ids: [fcoeoabgfenejglbffodgkkbkcdhcgfn]

  - id: claude-code
    name: Claude Code
    classification: Coding agent
    # Ships as a native installer, NOT an npm package. The binary at ~/.local/bin/claude
    # is a symlink into ~/.local/share/claude/versions/<ver>, which is where the version
    # comes from. Never execute it to ask.
    binaries: ["~/.local/bin/claude"]
    npm: ["@anthropic-ai/claude-code"]
    state_dirs: ["~/.claude"]

  - id: openclaw
    name: OpenClaw
    classification: Personal agent
    # ai.openclaw.mac is the shipped identifier, read off a live 2026.7.1 install.
    # bot.molt.mac comes from the Moltbot lineage and is retained for machines that
    # installed the earlier version. The Homebrew cask's zap stanza still lists the old
    # paths, which is exactly how the wrong one got shipped.
    bundle_ids: [ai.openclaw.mac, bot.molt.mac]
    homebrew: [openclaw]
    npm: [openclaw, clawdbot, moltbot]
    state_dirs: ["~/.openclaw"]
    launchd_prefixes: [ai.openclaw., bot.molt.]
    # RETIRED ALIASES. Kept because machines that installed the earlier version still
    # carry them, and NOT reachable by installing anything today -- which makes them the
    # one class of identifier a real-install scenario can never cover. A fixture row is
    # not a weaker grade for these, it is the only possible evidence, and it earns its
    # place: it proves the alias still resolves to this agent, so a later tidy-up of the
    # catalog or a refactor of the matcher cannot drop them silently.
    retired: [bot.molt.mac, bot.molt., clawdbot, moltbot]
    ports: [18789]

  - id: chatgpt-desktop
    name: ChatGPT Desktop
    classification: Desktop assistant
    # com.openai.codex, not com.openai.chat. The obvious guess is wrong.
    bundle_ids: [com.openai.codex]
    homebrew: [chatgpt]

  - id: codex-cli
    name: Codex CLI
    classification: Coding agent
    npm: ["@openai/codex"]
    homebrew: [codex]                  # a cask, not a formula; both land in homebrew_packages
    state_dirs: ["~/.codex"]

  - id: cursor
    name: Cursor
    classification: Coding agent
    # An opaque ToDesktop identifier. Unguessable; it must be pinned.
    bundle_ids: [com.todesktop.230313mzl4w4u92]
    homebrew: [cursor]





  - id: perplexity-comet
    name: Perplexity Comet
    classification: AI browser
    # A Chromium fork, absent from osquery's browser_type, so it is detected as a bundle.
    bundle_ids: [ai.perplexity.comet]
    homebrew: [comet]

  - id: perplexity-desktop
    name: Perplexity
    classification: Desktop assistant
    bundle_ids: [ai.perplexity.macv3]  # a separate product from Comet; do not conflate
    homebrew: [perplexity]

  - id: windsurf
    name: Windsurf
    classification: Coding agent
    bundle_ids: [com.exafunction.windsurf]
    homebrew: [devin-desktop]          # cask renamed from `windsurf`

  - id: orion
    name: Orion
    classification: AI browser
    bundle_ids: [com.kagi.kagimacOS]
    homebrew: [orion]

  - id: aider
    name: aider
    classification: Coding agent
    homebrew: [aider]
    npm: [aider]
    pypi: [aider-chat]                 # the usual route; the npm name differs
    state_dirs: ["~/.aider"]
    # Read off a real row: "paulgauthier/aider:latest", id cd375f1ecbd1. ENTRYPOINT is
    # /venv/bin/aider, which is the same package the pypi route above names.
    images: [paulgauthier/aider]

  - id: gemini-cli
    name: Gemini CLI
    classification: Coding agent
    homebrew: [gemini-cli]
    npm: ["@google/gemini-cli"]        # a vendor scope, missed by @anthropic-ai/@openai globs

  - id: copilot-cli
    name: GitHub Copilot CLI
    classification: Coding agent
    homebrew: [copilot-cli]
    npm: ["@github/copilot"]

  - id: cline
    name: Cline
    classification: Coding agent
    npm: [cline]



